<title>a plan, a recording, and a page</title>
<rect x="0" y="0" width="834" height="1753" rx="9" fill="#16161e"/>
<rect x="0" y="0" width="834" height="30" rx="9" fill="#1f2335"/>
<rect x="0" y="21" width="834" height="9" fill="#1f2335"/>
<rect x="0.5" y="0.5" width="833" height="1752" rx="9" fill="none" stroke="#2f3549"/>
