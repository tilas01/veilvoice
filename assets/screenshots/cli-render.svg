<text x="417" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#737aa2" text-anchor="middle">veilvoice conversation render --help</text>
<text x="18.0" y="46.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Render a recording according to a plan.</text>
<text x="18.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Writes the audio and both subtitle formats. Audio that no turn claims is **silenced**, never</text>
<text x="18.0" y="103.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">passed through -- it has not been veiled, and a gap in a plan must not put a real voice into the</text>
<text x="18.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">result. How much went is printed.</text>
<text x="18.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#7aa2f7" xml:space="preserve">Usage: veilvoice conversation render [OPTIONS] &lt;PLAN&gt; &lt;INPUT&gt;</text>
<text x="18.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Arguments:</text>
<text x="18.0" y="217.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  &lt;PLAN&gt;</text>
<text x="18.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          The plan file</text>
<text x="18.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  &lt;INPUT&gt;</text>
<text x="18.0" y="293.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          The recording</text>
<text x="18.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Options:</text>
<text x="18.0" y="350.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -o, --output &lt;OUTPUT&gt;</text>
<text x="18.0" y="369.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Where to write the audio. The subtitles take the same name</text>
<text x="18.0" y="407.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --intensity &lt;INTENSITY&gt;</text>
<text x="18.0" y="426.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          0..1 -- how far the transform pushes</text>
<text x="18.0" y="464.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 1]</text>
<text x="18.0" y="502.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --keep-accent</text>
<text x="18.0" y="521.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Leave the speaker's accent and intonation intact</text>
<text x="18.0" y="559.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --reseed-secs &lt;RESEED_SECS&gt;</text>
<text x="18.0" y="578.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Seconds between modulation seed rolls; 0 keeps one stream</text>
<text x="18.0" y="616.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 2]</text>
<text x="18.0" y="654.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --reseed-range &lt;RESEED_RANGE&gt;</text>
<text x="18.0" y="673.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Draw each gap from a range instead, in milliseconds: `250,1800`.</text>
<text x="18.0" y="711.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          A fixed interval is a fixed thing to observe. With a range, the gap before every roll</text>
<text x="18.0" y="730.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          is drawn fresh from the modulation stream, so the ratchet has no period at all.</text>
<text x="18.0" y="768.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Without this, the range is **drawn from the operating system's random source at</text>
<text x="18.0" y="787.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          launch**, so it is a property of this run rather than a number compiled into every</text>
<text x="18.0" y="806.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          copy of VeilVoice. Pass `--reseed-range fixed` to use `--reseed-secs` instead.</text>
<text x="18.0" y="844.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          A value that is not a usable range is **refused with the reason**, never adjusted to</text>
<text x="18.0" y="863.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          fit.</text>
<text x="18.0" y="901.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --page</text>
<text x="18.0" y="920.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Also write a self-contained HTML player beside the audio.</text>
<text x="18.0" y="958.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          The waveform, a circle per speaker that lights when they speak, and the subtitles. It</text>
<text x="18.0" y="977.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          reads the audio and the WebVTT track by name from the same directory, so move all of</text>
<text x="18.0" y="996.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          them or none.</text>
<text x="18.0" y="1034.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --width &lt;WIDTH&gt;</text>
<text x="18.0" y="1053.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Picture width in pixels</text>
<text x="18.0" y="1091.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 1280]</text>
<text x="18.0" y="1129.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --height &lt;HEIGHT&gt;</text>
<text x="18.0" y="1148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Picture height in pixels</text>
<text x="18.0" y="1186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 720]</text>
<text x="18.0" y="1224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --padding &lt;PADDING&gt;</text>
<text x="18.0" y="1243.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Margin around everything, in pixels</text>
<text x="18.0" y="1281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 48]</text>
<text x="18.0" y="1319.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --background &lt;BACKGROUND&gt;</text>
<text x="18.0" y="1338.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          A `#rrggbb` colour, or the path to an image file</text>
<text x="18.0" y="1376.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --black</text>
<text x="18.0" y="1395.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Plain black behind everything. Overrides `--background`</text>
<text x="18.0" y="1433.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --theme &lt;THEME&gt;</text>
<text x="18.0" y="1452.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Colour scheme, from the nine the website and the app offer.</text>
<text x="18.0" y="1490.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Defaults to Tokyo Night. An unknown name is refused, and the error lists every one it</text>
<text x="18.0" y="1509.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          could have been.</text>
<text x="18.0" y="1547.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --one-voice</text>
<text x="18.0" y="1566.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Give every speaker the **same** voice.</text>
<text x="18.0" y="1604.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          More private: the output then carries no trace of *which* speaker somebody was, so two</text>
<text x="18.0" y="1623.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          recordings of the same group cannot be lined up by voice. The price is that only the</text>
<text x="18.0" y="1642.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          names and the picture say who is speaking -- by ear alone, nobody can. It also has no</text>
<text x="18.0" y="1661.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          speaker limit, because one voice cannot collide with itself.</text>
<text x="18.0" y="1699.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -h, --help</text>
<text x="18.0" y="1718.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print help (see a summary with '-h')</text>
</svg>
