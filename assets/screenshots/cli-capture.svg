<text x="417" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#737aa2" text-anchor="middle">veilvoice capture --help</text>
<text x="18.0" y="46.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Which screen recorders are running, and which you meant to run.</text>
<text x="18.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">**VeilVoice does not hide its own window from capture.** You can record this application with</text>
<text x="18.0" y="103.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">OBS or anything else, deliberately, and nothing here prevents it. Excluding a window from</text>
<text x="18.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">capture needs `unsafe` FFI, which every crate in this workspace forbids, so the exclusion is not</text>
<text x="18.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">built -- see ROADMAP.md.</text>
<text x="18.0" y="179.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">What this does is tell you a recorder is running, once, and then stop telling you if you say you</text>
<text x="18.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">meant it. A monitor that warns every thirty seconds while you record a tutorial is a monitor you</text>
<text x="18.0" y="217.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">switch off, and then it is not watching for the recorder you did *not* start.</text>
<text x="18.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Two things it cannot do. It only knows the programs in its table, so an empty report is not</text>
<text x="18.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">evidence that nothing is recording. And it cannot tell whether a program that is running is</text>
<text x="18.0" y="293.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">actually capturing anything -- a meeting application being open is not somebody watching your</text>
<text x="18.0" y="312.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">screen.</text>
<text x="18.0" y="350.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#7aa2f7" xml:space="preserve">Usage: veilvoice.exe capture &lt;COMMAND&gt;</text>
<text x="18.0" y="388.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Commands:</text>
<text x="18.0" y="407.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  status  What is running, what is allowed, and what this cannot see</text>
<text x="18.0" y="426.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  list    Every program this build knows how to notice</text>
<text x="18.0" y="445.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  calls   Where to point Discord, Signal, Telegram, Element and the rest so your voice goes</text>
<text x="18.0" y="464.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          through VeilVoice first</text>
<text x="18.0" y="483.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  allow   Stop notifying about one program</text>
<text x="18.0" y="502.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  deny    Start notifying about one program again</text>
<text x="18.0" y="521.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  check   Look now, and exit non-zero if something unallowed is running</text>
<text x="18.0" y="540.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  help    Print this message or the help of the given subcommand(s)</text>
<text x="18.0" y="578.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Options:</text>
<text x="18.0" y="597.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -h, --help</text>
<text x="18.0" y="616.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print help (see a summary with '-h')</text>
</svg>
