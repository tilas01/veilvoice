#
# cargo-audit policy.
#
# Two categories, kept apart on purpose because they are not the same kind of
# decision:
#
#   1. *Unmaintained* advisories -- a maintenance signal, not a known exploit.
#   2. A *vulnerability* judged unreachable in this tree. There are two, on
#      the same ground, each argued in full below, and that ground is guarded
#      mechanically in CI so that the argument cannot quietly stop being true.
#
# The second category is a weakening of the rule this file used to state --
# "vulnerabilities always fail the build" -- and it is written out rather than
# folded into the list above it, because an exception that looks like the
# entries around it is an exception nobody re-reads. Every entry is reviewed at
# each release.

[advisories]
ignore = [
    # paste 1.0.15, a proc-macro helper, pulled in transitively by the audio and
    # GUI stacks. Compile-time only: it emits no code into the binary and has
    # no runtime attack surface. No known vulnerability, author simply stepped
    # away. Drops out when upstream crates migrate.
    "RUSTSEC-2024-0436",

    # zvariant 5.15.0, zvariant_derive 5.15.0 and zbus_names 4.3.4, the D-Bus
    # serialisation half of zbus 5. The zbus project merged all three into zbus
    # 6 and stopped maintaining them as separate crates. No known
    # vulnerability. They arrive through one path, used only on Linux and the
    # BSDs to ask the desktop's own portal for a file dialog:
    #
    #     zvariant, zbus_names <- zbus 5 <- ashpd 0.11 <- rfd 0.16 <- veilvoice-gui
    #
    # Nothing VeilVoice reads from a recording or a vault passes through them.
    # rfd 0.17 drops zbus altogether, but it does so by opening libdbus at run
    # time through its own C bindings, which is a change of backend to weigh
    # on its own rather than a version bump. They drop out when that is done or
    # when ashpd moves to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",

    # --- category 2: a vulnerability, judged unreachable -------------------
    #
    # rsa 0.9.10 -- RUSTSEC-2023-0071, the Marvin attack: key recovery through
    # a timing side channel. Medium severity, and no fixed version exists.
    #
    # It arrives through exactly one path:
    #
    #     rsa <- pgp <- veilvoice-verify
    #
    # The advisory concerns operations performed with an RSA **private** key --
    # that is what "key recovery" means, and a timing oracle needs a secret to
    # be leaking. `veilvoice-verify` performs signature *verification* and
    # nothing else: it holds a public key compiled into the binary, there is no
    # private key anywhere in this repository or in any released artefact, and
    # no code path in the workspace decrypts or signs with RSA. VeilVoice's own
    # cryptography is X25519 + ML-KEM-768, XChaCha20-Poly1305 and Argon2id; it
    # has never used RSA for anything but checking release signatures, and the
    # release signing key is RSA-4096 so that check cannot be avoided.
    #
    # There is therefore no secret for the side channel to leak. That is an
    # argument about how the crate is *used*, so CI guards the usage: the "no
    # RSA private-key operations" job fails the build if any secret-key or
    # decryption API appears in the verifier. If that argument ever stops being
    # true, the build stops with it rather than this comment quietly ageing.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5 -- RUSTSEC-2026-0387: several operations meant to
    # run in constant time could branch on the values they were given, so a
    # timing side channel could leak a secret integer. The fix is in 0.7.6 and
    # nothing on this path can take it yet: the 0.5 line has no fixed release,
    # and pgp 0.21, the newest, still depends on 0.5.5.
    #
    # It arrives only through the elliptic-curve half of the same verifier:
    #
    #     crypto-bigint <- elliptic-curve, cx448 <- ecdsa, p256, p384, p521,
    #                      k256 <- pgp <- veilvoice-verify
    #
    # The ground is the one given for rsa above. A timing leak matters when
    # the integer is a secret. Checking a signature works on a public key and
    # a public signature, so there is no secret on this path to leak. The same
    # guard holds it: tools/audit/rsa_usage.py fails the build if any crate
    # reaching pgp gains a secret-key, signing or decryption path, which is
    # the only way a secret could reach this arithmetic.
    "RUSTSEC-2026-0387",
]

# `ttf-parser` was the third entry here, accepted on the ground that no
# attacker-supplied font ever reaches it. It left the dependency graph with the
# move to egui 0.36, which rasterises text without it, so the argument is not
# needed rather than being weaker: the crate is gone. This note is the record
# that the exception existed and why it stopped being one, since an entry that
# simply disappears reads as one nobody re-read.

# Unsound and yanked crates should still stop a release.
informational_warnings = ["unsound", "notice"]
