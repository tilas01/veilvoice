#
# cargo-audit policy.
#
# Two categories, kept apart on purpose because they are not the same kind of
# decision:
#
#   1. *Unmaintained* advisories -- a maintenance signal, not a known exploit.
#   2. A *vulnerability* judged unreachable in this tree. There is exactly one,
#      it is argued in full below, and it is guarded mechanically in CI so that
#      the argument cannot quietly stop being true.
#
# The second category is a weakening of the rule this file used to state --
# "vulnerabilities always fail the build" -- and it is written out rather than
# folded into the list above it, because an exception that looks like the
# entries around it is an exception nobody re-reads. Every entry is reviewed at
# each release.

[advisories]
ignore = [
    # paste 1.0.15 — proc-macro helper, pulled in transitively by the audio and
    # GUI stacks. Compile-time only: it emits no code into the binary and has
    # no runtime attack surface. No known vulnerability, author simply stepped
    # away. Drops out when upstream crates migrate.
    "RUSTSEC-2024-0436",

    # ttf-parser 0.25.1 — transitive through egui's font rasteriser. It does
    # parse untrusted input (font files), but the only fonts VeilVoice loads are
    # egui's own embedded face and, optionally, a JetBrains Mono the user
    # already installed system-wide. No attacker-supplied font ever reaches it.
    # Revisit whenever egui updates its text stack.
    "RUSTSEC-2026-0192",

    # --- category 2: a vulnerability, judged unreachable -------------------
    #
    # rsa 0.9.10 -- RUSTSEC-2023-0071, the Marvin attack: key recovery through
    # a timing side channel. Medium severity, and no fixed version exists.
    #
    # It arrives through exactly one path:
    #
    #     rsa <- pgp <- veilvoice-verify
    #
    # The advisory concerns operations performed with an RSA **private** key --
    # that is what "key recovery" means, and a timing oracle needs a secret to
    # be leaking. `veilvoice-verify` performs signature *verification* and
    # nothing else: it holds a public key compiled into the binary, there is no
    # private key anywhere in this repository or in any released artefact, and
    # no code path in the workspace decrypts or signs with RSA. VeilVoice's own
    # cryptography is X25519 + ML-KEM-768, XChaCha20-Poly1305 and Argon2id; it
    # has never used RSA for anything but checking release signatures, and the
    # release signing key is RSA-4096 so that check cannot be avoided.
    #
    # There is therefore no secret for the side channel to leak. That is an
    # argument about how the crate is *used*, so CI guards the usage: the "no
    # RSA private-key operations" job fails the build if any secret-key or
    # decryption API appears in the verifier. If that argument ever stops being
    # true, the build stops with it rather than this comment quietly ageing.
    "RUSTSEC-2023-0071",
]

# Unsound and yanked crates should still stop a release.
informational_warnings = ["unsound", "notice"]
