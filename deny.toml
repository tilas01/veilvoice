# SPDX-License-Identifier: GPL-3.0-or-later
#
# cargo-deny policy: licences, sources and duplicate versions.
#
# `cargo audit` answers one question, whether anything in the graph has an
# advisory against it, and `.cargo/audit.toml` argues each exception. This file
# answers the three questions that tool does not ask: whether every licence in
# the graph can be shipped under GPL-3.0-or-later, whether every crate comes
# from crates.io, and whether the same crate is compiled twice at two versions.
#
# The advisory list is repeated here because cargo-deny reads its own file and
# not cargo-audit's. The arguments live in `.cargo/audit.toml`; this is the
# same three identifiers and nothing else, and `tools/audit/dependencies.py`
# fails the build if the two lists drift apart.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste: unmaintained, compile-time only
    "RUSTSEC-2023-0071", # rsa: Marvin needs a private key; there is none here
]

[licenses]
# Every licence that appears in the graph today, each compatible with
# GPL-3.0-or-later. A licence not on this list stops the build until somebody
# has read it, which is the point: the graph is meant to be readable, and a
# licence nobody has read is not.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# Two versions of one crate is two copies of its code in every binary and, for
# a cryptographic crate, two implementations of one primitive. A warning
# rather than a failure: the graph carries thirty-odd today, nearly all of them
# `windows-sys`, `objc2` and `rustix` generations that the windowing and audio
# stacks pull at different ages, and only their upstream releases can collapse
# those. The ones this project can move itself (`rand`, `rand_core`,
# `rand_chacha`, `getrandom`) are moved by taking the dependency updates that
# align them, not by hiding the warning.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
