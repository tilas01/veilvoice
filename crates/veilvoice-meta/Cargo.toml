[package]
name = "veilvoice-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Strip or spoof identifying metadata: audio tags, and image EXIF/GPS."

[dependencies]
# Audio tag containers (ID3v1/v2, Vorbis comments, MP4 atoms, APE, ...).
lofty = "0.25"
# Container-level image surgery: drops EXIF/XMP without re-encoding pixels.
img-parts = "0.4"

[dev-dependencies]
# Tests that write a real WAV, so the cleaner is run over a file rather than
# over bytes this crate made up.
hound = "3"
# Tests that write a file and clean it, in a directory that goes away with
# them.
tempfile = "3"
