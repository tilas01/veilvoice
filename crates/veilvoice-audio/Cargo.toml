[package]
name = "veilvoice-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Real-time capture and playback (cpal), lock-free ring buffers, virtual-cable routing and file import for VeilVoice."

[features]
default = ["live"]
# Live capture and playback. Optional because `cpal` has no backend for the
# BSDs, and everything else this crate does — decoding, encoding, and running
# the engine over a buffer — is pure Rust and builds anywhere. Turning this off
# keeps file processing available on platforms that cannot do live audio.
live = ["dep:cpal", "dep:ringbuf"]

[dependencies]
veilvoice-core = { path = "../veilvoice-core" }
# Cross-platform audio I/O: WASAPI, CoreAudio, ALSA/JACK.
cpal = { version = "0.15", optional = true }
# Lock-free SPSC ring buffer between the audio callbacks and the DSP thread.
ringbuf = { version = "0.5", optional = true }
# WAV read/write.
hound = "3"
# Decoding for everything else on import.
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac", "flac", "vorbis", "ogg", "wav", "pcm"] }

[dev-dependencies]
tempfile = "3"
