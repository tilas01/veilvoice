[package]
name = "veilvoice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for VeilVoice: anonymise files, scramble a microphone live, strip metadata, encrypt recordings."

[[bin]]
name = "veilvoice"
path = "src/main.rs"

[dependencies]
veilvoice-core = { path = "../veilvoice-core" }
veilvoice-crypto = { path = "../veilvoice-crypto" }
veilvoice-audio = { path = "../veilvoice-audio" }
veilvoice-meta = { path = "../veilvoice-meta" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
