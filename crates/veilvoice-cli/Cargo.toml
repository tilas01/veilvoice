[package]
name = "veilvoice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for VeilVoice: anonymise files, scramble a microphone live, strip metadata, encrypt recordings."

[[bin]]
name = "veilvoice"
path = "src/main.rs"

[features]
default = ["live"]
# Live microphone scrambling. Off on platforms with no `cpal` backend (the
# BSDs); file processing, encryption and metadata cleaning still work there.
live = ["veilvoice-audio/live"]

[dependencies]
veilvoice-core = { path = "../veilvoice-core" }
veilvoice-crypto = { path = "../veilvoice-crypto" }
veilvoice-guard = { path = "../veilvoice-guard" }
veilvoice-audio = { path = "../veilvoice-audio", default-features = false }
veilvoice-meta = { path = "../veilvoice-meta" }
veilvoice-setup = { path = "../veilvoice-setup" }
veilvoice-watch = { path = "../veilvoice-watch" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"

# Embeds the application icon and version block into the Windows executable.
# A *build* dependency only: it is not in the shipped dependency graph, and the
# `offline` CI job that forbids network crates is unaffected.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
