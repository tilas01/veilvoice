[package]
name = "veilvoice-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe front-end for VeilVoice: Tokyo Night, monospace, three modes."

[[bin]]
name = "veilvoice-gui"
path = "src/main.rs"

[dependencies]
veilvoice-core = { path = "../veilvoice-core" }
veilvoice-audio = { path = "../veilvoice-audio" }
veilvoice-crypto = { path = "../veilvoice-crypto" }
veilvoice-meta = { path = "../veilvoice-meta" }
veilvoice-policy = { path = "../veilvoice-policy" }
veilvoice-check = { path = "../veilvoice-check" }
veilvoice-conversation = { path = "../veilvoice-conversation" }
veilvoice-setup = { path = "../veilvoice-setup" }
veilvoice-update = { path = "../veilvoice-update" }
veilvoice-video = { path = "../veilvoice-video" }
veilvoice-workspace = { path = "../veilvoice-workspace" }
veilvoice-watch = { path = "../veilvoice-watch" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Wipes typed passphrases out of the text fields that necessarily hold them in
# the clear; see the `security` module for what that does and does not buy.
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"

# Embeds the application icon and version block into the Windows executable.
# A *build* dependency only: it is not in the shipped dependency graph, and the
# `offline` CI job that forbids network crates is unaffected.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
