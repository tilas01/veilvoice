# The portable verifier: one small binary that checks a VeilVoice release
# without GnuPG installed. See src/lib.rs for what it does and does not prove.
#
# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "veilvoice-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Verify a VeilVoice release without GnuPG installed"

[dependencies]
# A full OpenPGP implementation, in pure Rust, so this binary needs no GnuPG
# and no C toolchain.
#
# `default-features = false` drops bzip2. A detached signature over a hash list
# is never compressed, so the only thing the default feature would buy is a
# decompressor this tool can never reach -- and an attack surface reachable
# only through input it refuses anyway.
#
# This is by far the largest dependency in the project, and that is a real cost
# honestly weighed: the alternative was hand-writing OpenPGP packet parsing and
# RSA PKCS#1 v1.5 verification, and a subtle mistake there would be a silent
# accept in the one tool whose entire job is not to silently accept. A widely
# used implementation that many people read is the better risk.
# The checking itself lives in this crate's `check` module, so the desktop
# application's verify tab and this binary share one implementation rather than
# holding two. This crate keeps the command line, the reporting, and the
# download shim; it no longer owns the arithmetic.
# Where an installation goes on each platform, so the `install` command puts
# files exactly where the application itself would. No dependencies of its own.
veilvoice-setup = { path = "../veilvoice-setup" }
# Roadmap item 97. Runs the GnuPG already on the machine, so the signature is
# checked by two independent implementations rather than only this one. No
# dependencies of its own, which matters in the one binary here whose size is
# a feature.
# Reading the signed public key and checking a detached signature with no
# GnuPG installed, which is the whole point of this verifier.
pgp = { version = "0.20", default-features = false }
# The SHA-256 in `check::sha256_file`, which is the hash every published
# list is written in.
sha2 = "0.10"
# Roadmap item 164. Decompressing a release archive so every file inside it can
# be hashed where it sits, rather than only after somebody has unpacked it.
#
# This adds no crate to the graph: `pgp`, above, already depends on it, so the
# code is compiled into this binary either way and naming it here costs nothing
# but makes the reliance honest.
#
# It is the only part of reading an archive that is not written in
# `check::archive`. Walking a tar header or a zip central directory is a loop
# over fixed-width fields, and this verifier never unpacks -- it hashes members
# where they lie and compares the names as strings -- so the defects that make
# archive extraction dangerous have nothing to reach here. Inflating is the
# opposite kind of problem, and a hand-written DEFLATE in the one tool whose job
# is not to silently accept is not a trade worth making.
#
# `default-features` are kept, and the backend is not chosen here. Measured
# with `cargo tree -p veilvoice-verify -e features`: `pgp` turns on
# `flate2/zlib-rs`, features unify across the graph, and that backend is
# therefore what this binary compiles either way. Naming a different one here
# would not change what is built, it would only add a second one beside it.
# Both it and flate2's own default are Rust, so nothing here asks for a C
# toolchain in a binary whose whole point is needing nothing installed.
flate2 = "1"

[dev-dependencies]
# Tests that build a release layout and verify it, in a directory that goes
# away with them.
tempfile = "3"

# Embeds the application icon and version block into the Windows executable.
# A *build* dependency only: it is not in the shipped dependency graph, and the
# `offline` CI job that forbids network crates is unaffected.
[target.'cfg(windows)'.build-dependencies]
# The Windows resource block: the icon, the version and the manifest, compiled
# into the executable by `build.rs`.
winresource = "0.1"
