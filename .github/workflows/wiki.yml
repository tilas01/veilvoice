# SPDX-License-Identifier: GPL-3.0-or-later
#
# Check `wiki/` on every push, and publish it to the repository's GitHub wiki
# when a release is published.
#
# A GitHub wiki is a git repository of its own, at `<repo>.wiki.git`, holding
# flat Markdown pages and nothing else. The pages in `wiki/` are generated into
# the main repository by `tools/docs/generate.py`, `tools/docs/guides.py` and
# `tools/docs/wiki.py`, and CI already fails if they have drifted from the
# source. This is the step that puts them where a reader looks.
#
# Why a copy rather than a symlink or a submodule: the wiki repository cannot
# contain either. It is flat Markdown, so the pages are written into it.
#
# # Why checking and publishing happen at different times
#
# Publishing waits for a release, deliberately and for the same reason
# `pages.yml` does: what is published describes what has been released. There
# is one branch, `main`, and work is committed to it every day, so publishing
# on a push would put pages describing unreleased work in front of readers.
# It used to publish on a push to `main`, which was right while `main` moved
# only when a release was cut. Now it publishes when `release.yml` succeeds,
# from the commit that release was built from, or by hand, from the newest
# release.
#
# Checking must not wait. A change that would fail to publish has to fail on
# the push that made it, not on the release, which is the worst moment to find
# out. Worse, a workflow that does not run shows no red cross, and a commit
# with no result beside it reads exactly like a commit that passed. That is
# F-197's shape, and it is written up four times in `docs/AUDIT.md` now.
#
# So `check` runs on every push and pull request, and asserts what `publish`
# needs before `publish` is the thing that finds out: the pages match their
# sources, every `[[link]]` in them resolves, and every one of them is
# something a wiki can actually hold. `tools/docs/wiki.py --check` is also run
# by `ci.yml` and by `tools/verify.py`; running it here as well is what makes
# this workflow's own result mean something on a push it does not publish.
# `publish` runs it once more, on the release it is about to copy.

name: wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'tools/docs/**'
      - 'tools/site/wiki_site.py'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'tools/docs/**'
      - 'tools/site/wiki_site.py'
      - '.github/workflows/wiki.yml'
  # When a release finishes. Success only, and a run that published nothing
  # leaves no tag, which is how `release` below tells a dry run apart.
  workflow_run:
    workflows: [release]
    types: [completed]
  # Publish the newest release's wiki again, by hand.
  workflow_dispatch:

# Pushing to the wiki is a write to this repository's content. The check job
# needs nothing but the code, and says so for itself.
permissions:
  contents: read

jobs:
  check:
    name: check the wiki
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # The same command `ci.yml` and `tools/verify.py` run. It regenerates
      # every page into memory and compares, so a source edited without the
      # generator being run fails here; it then walks every `[[link]]` in all
      # of them, because a wiki renders a link to a missing page as an
      # invitation to create it and nothing else would ever report one; and it
      # refuses a file the wiki could not hold as a page.
      - name: The pages must match their sources, and be publishable
        run: python tools/docs/wiki.py --check

      # The other half of the same claim: the website carries the whole wiki,
      # rendered in the site's own style from the same Markdown. If these two
      # disagree, one of the two copies a reader can find is wrong.
      - name: The website's wiki must match the wiki
        run: |
          python tools/site/wiki_site.py --check

  # The same question `pages.yml` asks, answered the same way: after a
  # release run, the release tag at the commit it built, and none for a dry
  # run; by hand, the newest release. Never a prerelease, which is an early
  # build rather than what has been released.
  release:
    name: which release to publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find the release
        id: which
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BUILT" ]; then
            tag="$(git tag --points-at "$BUILT" --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "no release tag names $BUILT: that run was a dry run or a prerelease, so the wiki stays as it is" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            tag="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "::error::there is no release tag, so there is nothing to publish"
              exit 1
            fi
          fi
          echo "publishing the wiki from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: publish the wiki
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, and on this job rather than on the workflow. Two runs
    # racing to push to the same wiki repository is a rejected push and a red
    # workflow for no reason anybody can act on. The check job has no such
    # problem and must not queue behind a publish: it is the one that has to
    # answer quickly, on every push and every pull request.
    concurrency:
      group: wiki-publish
      cancel-in-progress: false
    steps:
      # The release, by its tag, rather than the tip of `main`, which has
      # usually moved on by the time a release finishes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # What `check` asks on a push, asked of the tree being published. It
      # passed when that commit was pushed, so this is cheap insurance rather
      # than a new question.
      - name: The pages must match their sources, and be publishable
        run: python tools/docs/wiki.py --check

      # The wiki repository does not exist until the wiki has a first page.
      # Enabling the wiki in Settings is not enough: the repository behind it
      # is created when a page is first saved, and until then a clone of it
      # answers "Repository not found". That is what this workflow did on
      # every run from the day it was written until it was fixed, and the
      # error it printed was right about the cause.
      #
      # So it tries to create the repository itself before asking a person to.
      # A push to a wiki that has never been initialised may be refused. Where
      # it is accepted, the manual step disappears for good.
      #
      # Where it is refused, this job is skipped rather than failed (F-259).
      # A missing wiki is a one-time setting for the maintainer, not a fault in
      # the commit being published, and failing here put a red cross on every
      # release for something no change to the code could fix. The check job above still fails on anything wrong with the pages
      # themselves, so what is skipped is only the copy, and the run says so
      # in a warning and in its summary rather than passing in silence. Any
      # other clone failure, a network error or a refused token, still fails:
      # the wiki exists then, and not publishing to it is a fault.
      #
      # `ready` is this step's answer, and every step after it reads it.
      - name: Clone the wiki repository, creating it if it does not exist
        id: wiki
        run: |
          set -euo pipefail
          remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          if git clone "$remote" wiki-repo 2>/tmp/clone.log; then
            echo "cloned the existing wiki"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat /tmp/clone.log
          if ! grep -qi "not found" /tmp/clone.log; then
            echo "::error::The wiki for ${{ github.repository }} exists but could not be cloned; see the output above."
            exit 1
          fi
          echo "the wiki repository does not exist yet; trying to create it"

          # An empty repository with one real page. `Home` is the page GitHub
          # opens a wiki on, so if this succeeds a reader arriving before the
          # copy step below has run still lands somewhere that makes sense.
          # Everything here is replaced from `wiki/` in the next step either
          # way.
          mkdir wiki-repo
          cd wiki-repo
          git init --initial-branch=master
          git config user.name  "tilas01"
          git config user.email "tilas01@users.noreply.github.com"
          cp ../wiki/Home.md .
          git add Home.md
          git commit -m "Create the wiki from the repository"
          if git push "$remote" master 2>/tmp/create.log; then
            echo "created the wiki repository"
            git remote add origin "$remote" || git remote set-url origin "$remote"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat /tmp/create.log
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::The wiki was not published: ${{ github.repository }} has no wiki repository yet. Save any first page in the Wiki tab and re-run this workflow."
          {
            echo "### The wiki was not published"
            echo
            echo "The pages were checked and are ready, but this repository has"
            echo "no wiki repository behind it yet, and GitHub refused this"
            echo "workflow's attempt to create one. A GitHub wiki repository is"
            echo "created when the first page is saved through the web interface:"
            echo
            echo "1. Open the repository's **Wiki** tab."
            echo "2. Create a page with any content, and save it."
            echo "3. Re-run this workflow."
            echo
            echo "Everything the wiki holds is replaced from \`wiki/\` on the first"
            echo "successful run, so what that first page says does not matter."
            echo "The website's copy of the wiki is published by \`pages.yml\` and"
            echo "does not depend on this."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the generated pages in
        if: steps.wiki.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Every page in the wiki is generated, so the wiki is replaced rather
          # than merged into: a page deleted here must not survive there. The
          # `.git` directory is what makes this a delete-and-copy rather than a
          # fresh `git init`, because the history is worth keeping.
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md wiki-repo/
          echo "pages now in the wiki: $(ls wiki-repo/*.md | wc -l)"

      - name: Commit and push, if anything changed
        if: steps.wiki.outputs.ready == 'true'
        working-directory: wiki-repo
        run: |
          set -euo pipefail
          git config user.name  "tilas01"
          git config user.email "tilas01@users.noreply.github.com"
          # The clone path already has an `origin`; the create path above made
          # this repository locally, so it may not. Set it either way rather
          # than assuming which path ran.
          remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          git remote set-url origin "$remote" 2>/dev/null \
            || git remote add origin "$remote"
          git add -A
          if git diff --cached --quiet; then
            echo "the wiki already matches the repository, nothing to push"
            exit 0
          fi
          git commit -m "Publish the wiki from ${{ needs.release.outputs.tag }}

          Generated in the main repository and copied here. Every page has a
          source file there, and CI fails if the two disagree, so editing a
          page here would be overwritten by the next run."
          git push origin HEAD
          echo "pushed"
