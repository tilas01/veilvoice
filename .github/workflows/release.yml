# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build, verify and publish release artefacts for a v* tag.
#
# Two properties this workflow exists to establish:
#   1. Every binary is built twice, in different directories, and compared byte
#      for byte. The per-platform verdict is published in the release notes
#      rather than hidden: a release that is not reproducible on some target
#      still ships, but says so, because quietly claiming reproducibility would
#      be worse than admitting a gap.
#   2. Signing is optional. The private key lives in a repository secret that is
#      absent on forks, so a fork can still produce a complete (unsigned)
#      release rather than a broken one.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish, e.g. v0.1.15 (leave empty for a dry run)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The version being published.
  #
  # This input existed and was **ignored**: every job named its artefacts after
  # `github.ref_name`, which on a dispatch is the branch, so a run from `main`
  # produced files called `veilvoice-main-...` and would have tried to publish a
  # release named `main`. A declared input that changes nothing is worse than no
  # input, because it reads like a supported way to do the thing.
  #
  # It is read now, and it is how a release is cut when a tag cannot be pushed
  # from where the work was done. Given `v0.1.15`, this builds the branch it was
  # dispatched from, names everything `v0.1.15`, and publishes a release, which
  # creates the tag at that commit. Given nothing, it is a dry run: everything
  # is built, compared, hashed, signed and reported, and nothing is published.
  #
  # Empty on a tag push, so this is the version either way.
  VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive: tar.gz
          # Intel macOS is cross-compiled from the Apple Silicon runner rather
          # than built on a macos-13 one: those runners are being retired, and
          # a release should not sit in a queue waiting for deprecated
          # hardware. The Apple SDK ships both slices, so rustc cross-links
          # this target natively.
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive: tar.gz
          # Native ARM64 Linux. GitHub provides arm64 runners for public
          # repositories, so this is a real build rather than a cross one and
          # the GUI comes with it.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            archive: tar.gz
          # Raspberry Pi OS 32-bit. Cross-compiled, and CLI only: the GUI would
          # need the whole GTK/OpenGL stack for armhf on the build host, which
          # is a great deal of machinery for a target where a headless box is
          # the normal case anyway.
          - os: ubuntu-24.04-arm
            target: armv7-unknown-linux-gnueabihf
            label: linux-armv7-pi
            archive: tar.gz
            cli_only: true
            # The libc package is named explicitly: apt would normally
            # pull it in as a recommendation, and --no-install-recommends
            # leaves the linker without Scrt1.o and crti.o.
            cross_gcc: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          # Statically linked musl builds. One binary, no libc version to
          # match, runs on any Linux including Alpine and old distributions.
          # CLI only, for the same reason as above.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64-musl-static
            archive: tar.gz
            cli_only: true
            cross_gcc: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            label: linux-arm64-musl-static
            archive: tar.gz
            cli_only: true
            cross_gcc: musl-tools

    steps:
      - uses: actions/checkout@v4

      # Only the GUI needs the windowing stack. A CLI-only target does not, and
      # on a cross target these packages would be for the wrong architecture.
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux' && !matrix.cli_only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxkbcommon-x11-0

      - name: Install the cross toolchain
        if: matrix.cross_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.cross_gcc }}

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # Everything that would otherwise vary between two builds of the same
      # source. See docs/REPRODUCIBLE_BUILDS.md.
      - name: Pin the build environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          # `pwd -P` resolves symlinks. macOS reports the workspace under /tmp
          # but canonicalises it to /private/tmp, and a remap that does not
          # match the canonical path silently does nothing.
          echo "SRC_A=$(pwd -P)" >> "$GITHUB_ENV"
          # Per-linker determinism flags.
          case "${{ runner.os }}" in
            Windows)
              # MSVC stamps a timestamp and a PDB signature into the PE header;
              # /Brepro replaces both with a hash of the input.
              echo "REPRO_LINK=-C link-arg=/Brepro" >> "$GITHUB_ENV"
              ;;
            macOS)
              # ld64 writes an LC_UUID load command that is not a pure function
              # of the input, so two identical builds differ by 16 bytes.
              # -no_uuid omits it. The cost is that crash reports cannot be
              # matched to a dSYM, which these stripped release binaries have
              # no dSYM for anyway.
              echo "REPRO_LINK=-C link-arg=-Wl,-no_uuid" >> "$GITHUB_ENV"
              # Stops `ar` writing timestamps into any static archive.
              echo "ZERO_AR_DATE=1" >> "$GITHUB_ENV"
              ;;
            *)
              echo "REPRO_LINK=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Select what to build
        shell: bash
        run: |
          if [ "${{ matrix.cli_only }}" = "true" ]; then
            # No live audio on these. cpal needs ALSA headers built for the
            # target architecture, which a cross or musl build does not have,
            # and a statically linked binary cannot dlopen the system ALSA
            # anyway. File processing, encryption and metadata cleaning are
            # pure Rust and work fine, so the feature is switched off rather
            # than the build failing.
            # The verifier ships everywhere, including here. It has no audio,
            # windowing or platform dependencies -- it reads two files and
            # checks a signature -- and it is most useful precisely on the
            # stripped-down targets, where GnuPG is least likely to be present.
            echo "CARGO_ARGS=-p veilvoice-cli -p veilvoice-verify --no-default-features" >> "$GITHUB_ENV"
            echo "BINARIES=veilvoice veilvoice-verify" >> "$GITHUB_ENV"
          else
            echo "CARGO_ARGS=--workspace" >> "$GITHUB_ENV"
            echo "BINARIES=veilvoice veilvoice-gui veilvoice-verify" >> "$GITHUB_ENV"
          fi
          case "${{ matrix.target }}" in
            armv7-unknown-linux-gnueabihf)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$SRC_A=/veilvoice --remap-path-prefix=$HOME/.cargo=/cargo $REPRO_LINK"
          cargo build --release --locked --target ${{ matrix.target }} $CARGO_ARGS

      # Reproducibility is the whole basis of "verify the binary matches the
      # source", so it is checked here rather than asserted in the docs.
      - name: Build again, elsewhere, and compare
        id: repro
        shell: bash
        run: |
          # Deliberately not under /tmp: macOS would canonicalise it and defeat
          # the remap, making this check pass for the wrong reason.
          rebuild="$HOME/vv-rebuild"
          rm -rf "$rebuild"
          cp -r "$SRC_A" "$rebuild"
          cd "$rebuild"
          src_b="$(pwd -P)"
          export RUSTFLAGS="--remap-path-prefix=$src_b=/veilvoice --remap-path-prefix=$HOME/.cargo=/cargo $REPRO_LINK"
          cargo build --release --locked --target ${{ matrix.target }} $CARGO_ARGS

          status=reproducible
          for name in $BINARIES; do
            for ext in "" ".exe"; do
              a="$SRC_A/target/${{ matrix.target }}/release/$name$ext"
              b="$src_b/target/${{ matrix.target }}/release/$name$ext"
              [ -f "$a" ] || continue
              if cmp -s "$a" "$b"; then
                echo "  identical: $name$ext"
              else
                echo "::warning::$name$ext differs between two builds of the same source"
                # Report enough to diagnose it next time rather than guess.
                echo "    size A: $(wc -c < "$a")  size B: $(wc -c < "$b")"
                echo "    first differing byte: $(cmp "$a" "$b" 2>&1 | head -1)"
                echo "    differing byte count: $(cmp -l "$a" "$b" 2>/dev/null | wc -l)"
                status=not-reproducible
              fi
            done
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.label }}: $status" > "repro-${{ matrix.label }}.txt"
          cp "repro-${{ matrix.label }}.txt" "$SRC_A/"

      # The icon lives in the executable's resource section, and a build that
      # failed to put it there succeeds silently -- the only symptom is
      # Explorer drawing a generic glyph. Checked on the artefacts that are
      # about to be signed.
      - name: Windows binaries must carry their icon
        if: runner.os == 'Windows'
        shell: bash
        # `target/<triple>/release`, not `target/release`: every build here is
        # an explicit `--target`, so cargo puts the output under the triple.
        # Pointing at the wrong path made the check report "no Windows binaries
        # found" and fail the whole release -- which is the right behaviour for
        # a check that must never pass vacuously, and the wrong path to give it.
        run: python tools/release/check-windows-icons.py "target/${{ matrix.target }}/release"

      - name: Stage the archive
        shell: bash
        run: |
          out="veilvoice-${{ env.VERSION_TAG }}-${{ matrix.label }}"
          mkdir -p "dist/$out"
          bin="target/${{ matrix.target }}/release"
          for name in $BINARIES; do
            for ext in "" ".exe"; do
              [ -f "$bin/$name$ext" ] && cp "$bin/$name$ext" "dist/$out/"
            done
          done
          cp README.md LICENSE "dist/$out/"
          cp "repro-${{ matrix.label }}.txt" dist/ 2>/dev/null || true
          if [ "${{ matrix.cli_only }}" = "true" ]; then
            {
              echo "This build contains the command-line tool only, without live"
              echo "microphone scrambling."
              echo
              echo "The desktop app needs the GTK and OpenGL stack for this"
              echo "architecture, and live capture needs ALSA headers for it. Neither is"
              echo "available to a cross or statically linked build. Everything else"
              echo "works: anonymise, clean, encrypt, decrypt, keygen, shred."
              echo
              echo "Run 'veilvoice info' to confirm what this binary supports."
              echo "To get live scrambling, build natively on the target machine."
            } > "dist/$out/NOTES.txt"
          fi
          cp -r docs "dist/$out/docs"
          # The per-file documentation references a generated SVG banner for
          # every crate and every source file. Shipping the pages without them
          # gives an offline reader 63 documents of broken images, so the
          # banners travel with the pages they belong to. About 100 KB of text.
          mkdir -p "dist/$out/assets"
          cp -r assets/banners "dist/$out/assets/banners"
          # Platform icons, in the form each system actually reads.
          #
          # Windows needs nothing here: `build.rs` embeds `assets/icon.ico` in
          # each executable's resource section, which is where Explorer, the
          # taskbar and a pinned shortcut look. Shipping a loose `.ico` beside
          # the binary -- which is what used to happen -- puts it somewhere
          # Windows never reads and the user never opens.
          case "${{ matrix.label }}" in
            macos-*)
              # The Finder reads `.icns`, and only from inside a bundle. The
              # file ships so a user (or a future `.app` recipe) has it; the
              # bundle itself is not built here and is not claimed to be.
              cp assets/icon.icns "dist/$out/" ;;
            linux-*)
              # freedesktop: a launcher entry plus the hicolor theme sizes.
              # Without these every Linux and BSD desktop draws a placeholder.
              cp -r assets/linux "dist/$out/desktop" ;;
          esac
          echo "STAGE=$out" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:STAGE" -DestinationPath "dist/$env:STAGE.zip"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C dist -czf "dist/$STAGE.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/repro-*.txt
          if-no-files-found: error

  # FreeBSD has no GitHub runner, so this builds inside a VM on a Linux one.
  #
  # It is CLI-only and deliberately so: `cpal` has no backend for the BSDs, so
  # live capture cannot work there. Everything else, meaning file
  # de-identification, encryption and metadata cleaning, is pure Rust and runs
  # fine, which is why the `live` feature exists to be turned off rather than
  # the whole build failing.
  #
  # Marked continue-on-error: a third-party VM action failing should not hold up
  # a release for the four first-class platforms. When it fails, the release
  # simply ships without a FreeBSD archive and says so.
  freebsd:
    name: freebsd-x86_64
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            set -e
            cargo build --release --locked -p veilvoice-cli --no-default-features
            ./target/release/veilvoice info
      - name: Stage the archive
        run: |
          out="veilvoice-${{ env.VERSION_TAG }}-freebsd-x86_64"
          mkdir -p "dist/$out"
          cp target/release/veilvoice "dist/$out/"
          cp README.md LICENSE "dist/$out/"
          cp -r docs "dist/$out/docs"
          # The per-file documentation references a generated SVG banner for
          # every crate and every source file. Shipping the pages without them
          # gives an offline reader 63 documents of broken images, so the
          # banners travel with the pages they belong to. About 100 KB of text.
          mkdir -p "dist/$out/assets"
          cp -r assets/banners "dist/$out/assets/banners"
          # FreeBSD, OpenBSD and NetBSD use the same freedesktop launcher
          # conventions as Linux, so they get the same icon set.
          cp -r assets/linux "dist/$out/desktop"
          {
            echo "This FreeBSD build has no live microphone scrambling: cpal, the"
            echo "audio device library, has no BSD backend. Everything else works:"
            echo "anonymise, clean, encrypt, decrypt, keygen."
            echo
            echo "Run 'veilvoice info' to confirm what this binary supports."
          } > "dist/$out/FREEBSD-NOTES.txt"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
          echo "freebsd-x86_64: not-verified (built once, in a VM)" > dist/repro-freebsd-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-x86_64
          path: |
            dist/*.tar.gz
            dist/repro-*.txt
          if-no-files-found: error

  openbsd:
    name: openbsd-x86_64
    runs-on: ubuntu-latest
    # Allowed to fail without stopping a release, exactly like FreeBSD. These
    # run in an emulated VM on a Linux runner and are the most fragile jobs
    # here; a release should not be blocked because somebody else's VM image
    # moved. When one fails the release simply ships without that archive.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI in a Openbsd VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add rust
          run: |
            set -e
            cargo build --release --locked -p veilvoice-cli -p veilvoice-verify --no-default-features
            ./target/release/veilvoice info
      - name: Stage the archive
        run: |
          out="veilvoice-${{ env.VERSION_TAG }}-openbsd-x86_64"
          mkdir -p "dist/$out"
          cp target/release/veilvoice "dist/$out/"
          cp target/release/veilvoice-verify "dist/$out/" 2>/dev/null || true
          cp README.md LICENSE "dist/$out/"
          cp -r docs "dist/$out/docs"
          # The per-file documentation references a generated SVG banner for
          # every crate and every source file. Shipping the pages without them
          # gives an offline reader 63 documents of broken images, so the
          # banners travel with the pages they belong to. About 100 KB of text.
          mkdir -p "dist/$out/assets"
          cp -r assets/banners "dist/$out/assets/banners"
          # FreeBSD, OpenBSD and NetBSD use the same freedesktop launcher
          # conventions as Linux, so they get the same icon set.
          cp -r assets/linux "dist/$out/desktop"
          {
            echo "This build has no live microphone scrambling: cpal, the audio"
            echo "device library, has no BSD backend. Everything else works:"
            echo "anonymise, clean, encrypt, decrypt, keygen, shred."
            echo
            echo "OpenBSD's pledge/unveil are not used: VeilVoice opens files the user names, and a sandbox it configures for itself would be a claim this project has not tested."
            echo
            echo "Run 'veilvoice info' to confirm what this binary supports."
          } > "dist/$out/NOTES.txt"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
          # Built once, in a VM, rather than twice in separate directories.
          # Reported as what it is rather than claimed.
          echo "openbsd-x86_64: not-verified (built once, in a VM)" > dist/repro-openbsd-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: openbsd-x86_64
          path: |
            dist/*.tar.gz
            dist/repro-*.txt
          if-no-files-found: error

  netbsd:
    name: netbsd-x86_64
    runs-on: ubuntu-latest
    # Allowed to fail without stopping a release, exactly like FreeBSD. These
    # run in an emulated VM on a Linux runner and are the most fragile jobs
    # here; a release should not be blocked because somebody else's VM image
    # moved. When one fails the release simply ships without that archive.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI in a Netbsd VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add rust
          run: |
            set -e
            cargo build --release --locked -p veilvoice-cli -p veilvoice-verify --no-default-features
            ./target/release/veilvoice info
      - name: Stage the archive
        run: |
          out="veilvoice-${{ env.VERSION_TAG }}-netbsd-x86_64"
          mkdir -p "dist/$out"
          cp target/release/veilvoice "dist/$out/"
          cp target/release/veilvoice-verify "dist/$out/" 2>/dev/null || true
          cp README.md LICENSE "dist/$out/"
          cp -r docs "dist/$out/docs"
          # The per-file documentation references a generated SVG banner for
          # every crate and every source file. Shipping the pages without them
          # gives an offline reader 63 documents of broken images, so the
          # banners travel with the pages they belong to. About 100 KB of text.
          mkdir -p "dist/$out/assets"
          cp -r assets/banners "dist/$out/assets/banners"
          # FreeBSD, OpenBSD and NetBSD use the same freedesktop launcher
          # conventions as Linux, so they get the same icon set.
          cp -r assets/linux "dist/$out/desktop"
          {
            echo "This build has no live microphone scrambling: cpal, the audio"
            echo "device library, has no BSD backend. Everything else works:"
            echo "anonymise, clean, encrypt, decrypt, keygen, shred."
            echo
            echo "Built against pkgsrc's Rust, which may lag the pinned toolchain; that is why this archive is marked not-verified for reproducibility."
            echo
            echo "Run 'veilvoice info' to confirm what this binary supports."
          } > "dist/$out/NOTES.txt"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
          # Built once, in a VM, rather than twice in separate directories.
          # Reported as what it is rather than claimed.
          echo "netbsd-x86_64: not-verified (built once, in a VM)" > dist/repro-netbsd-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: netbsd-x86_64
          path: |
            dist/*.tar.gz
            dist/repro-*.txt
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, freebsd, openbsd, netbsd]
    # `build` must succeed; `freebsd` is allowed to fail without stopping a
    # release, so this runs as long as the matrix itself did.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Evaluated at job level on purpose. A step's own `env:` block is not in
    # scope for that step's `if:`, so gating on it there silently disables the
    # step forever, which is exactly what v0.1.0 and v0.1.1 did.
    env:
      HAS_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      # **Marker 97.** A signed list of what is inside every archive.
      #
      # `SHA256SUMS` covers the archives. That proves a download is the one that
      # was published and says nothing whatever about the folder somebody
      # unzipped it into, which is the copy they actually run. Nothing on disk
      # records which archive a directory came from, so a verifier could only
      # report the two separately and tell people to extract it again.
      #
      # This closes that gap with arithmetic rather than advice. Staged
      # **before** `SHA256SUMS` is computed, so the hash list covers this file
      # too and the signature therefore covers it as well. The chain a verifier
      # can then follow is complete and every link in it is checkable:
      #
      #   SHA256SUMS.asc -> SHA256SUMS -> CONTENTS.sha256 -> each file on disk
      #
      # A script rather than six lines of shell here, because six lines of shell
      # cannot be run on a laptop, cannot be tested, and would be exercised for
      # the first time on the day a release goes out. This is the one link in
      # that chain nothing else checks, and
      # `crates/veilvoice-verify/tests/release_manifest.rs` builds a synthetic
      # release, runs this script, and reads the result back with the parser
      # that will read it for real.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List what is inside each archive
        run: python tools/release/contents.py staging -o staging/CONTENTS.sha256

      - name: Checksums
        run: |
          cd staging
          # The reproducibility reports are notes about the build, not artefacts
          # of it, so they are summarised in the notes rather than shipped.
          mkdir -p ../repro && mv repro-*.txt ../repro/ 2>/dev/null || true
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Optional: only runs when the maintainer has added the secret. Forks and
      # first-time contributors still get a complete, unsigned release.
      - name: Sign the checksums
        id: sign
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # printf '%s', not echo: echo appends a newline, and a passphrase
          # with a trailing newline is simply the wrong passphrase.
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          # --passphrase-file, never --passphrase: an argument is visible to
          # every other process through the process list.
          pp="$(mktemp)"
          printf '%s' "$GPG_PASSPHRASE" > "$pp"

          # Detached, and over the hash file only. The binaries are never
          # touched, so signing cannot disturb their reproducibility.
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$pp" \
              --detach-sign --armor staging/SHA256SUMS
          shred -u "$pp" 2>/dev/null || rm -f "$pp"

          # Publish the public half so a verifier need not trust a keyserver.
          gpg --armor --export > staging/veilvoice-signing-key.asc

          # Verify here rather than let whoever downloads it find out first.
          gpg --verify staging/SHA256SUMS.asc staging/SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          # The changelog lives in the repository, so what a release claims to
          # contain is reviewable in the same commit that contains it, rather
          # than being written from memory at tag time.
          tag="${{ env.VERSION_TAG }}"
          changes=""
          if [ -f CHANGELOG.md ]; then
            changes="$(awk -v want="## $tag" '
              $0 == want { taking = 1; next }
              taking && /^## / { exit }
              taking { print }
            ' CHANGELOG.md)"
          fi

          {
            echo "## VeilVoice ${{ env.VERSION_TAG }}"
            echo
            echo "Irreversible voice de-identification, fully offline."
            echo
            if [ -n "$changes" ]; then
              echo "$changes"
              echo
              echo "---"
              echo
            else
              echo "> No changelog section found for \`$tag\` in \`CHANGELOG.md\`."
              echo
            fi
            echo "### Verify what you downloaded"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            if [ -f staging/SHA256SUMS.asc ]; then
              fpr="$(gpg --show-keys --with-colons staging/veilvoice-signing-key.asc                      | awk -F: '/^fpr:/ {print $10; exit}')"
              echo "### Verify the signature"
              echo
              echo "\`SHA256SUMS.asc\` is a detached OpenPGP signature over the hash list."
              echo "No binary is signed in place, so signing cannot disturb the bit-for-bit"
              echo "reproducibility above."
              echo
              echo "**1. Import the key** (also on the [website](https://tilas01.github.io/veilvoice/#verify)):"
              echo
              echo '```bash'
              echo "gpg --import veilvoice-signing-key.asc"
              echo '```'
              echo
              echo "**2. Check the fingerprint is exactly this.** A \"Good signature\" from"
              echo "some other key proves nothing. The fingerprint is the part that matters:"
              echo
              echo '```'
              echo "$fpr"
              echo '```'
              echo
              echo "**3. Verify the hash list, then the files against it:**"
              echo
              echo '```bash'
              echo "gpg --verify SHA256SUMS.asc SHA256SUMS"
              echo "sha256sum -c SHA256SUMS --ignore-missing"
              echo '```'
              echo
              echo "Expect \`Good signature from \"tilas01\"\`. The key carries no e-mail"
              echo "address by design. GnuPG will also warn that the key is not certified"
              echo "with a trusted signature. That is normal and simply means you have not"
              echo "personally signed it; the fingerprint check above is what establishes"
              echo "that it is the right key."
              echo
              echo "On macOS use \`shasum -a 256 -c SHA256SUMS --ignore-missing\`."
            else
              echo "> This build is **unsigned**: no signing key is configured for this repository."
            fi
            echo
            echo "### Reproducibility"
            echo
            echo "Every binary was built twice, in different directories, and compared:"
            echo
            for f in repro/repro-*.txt; do
              [ -f "$f" ] && echo "- \`$(cat "$f")\`"
            done
            echo
            echo "See \`docs/REPRODUCIBLE_BUILDS.md\` to reproduce a build yourself."
            echo
            echo "Built on: \`${{ runner.os }}\` runners, toolchain pinned by \`rust-toolchain.toml\`."
          } > NOTES.md

      # **What decides whether this publishes, and the two things checked
      # before it does.**
      #
      # A tag push publishes, as it always has. A manual run publishes only
      # when it was given a version, and then only if that version survives
      # both checks below; a manual run with no version is a dry run and
      # reaches the summary at the end instead.
      #
      # The checks matter because a release cut from a branch has none of the
      # protection a tag gives. A tag is a commit somebody chose; a branch moves.
      # So the shape of the version is checked, because `softprops` would
      # cheerfully create a tag called `main`, and the version is checked
      # against the workspace, because publishing `v0.1.16` from a tree that
      # says `0.1.15` produces a release whose own binaries disagree with its
      # name.
      - name: Is this a release, and is it a coherent one
        id: gate
        run: |
          tag="${{ env.VERSION_TAG }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "no version given: this is a dry run and nothing will be published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a version like v0.1.15"; exit 1 ;;
          esac
          want="${tag#v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "::error::asked to publish $tag from a tree whose workspace version is $have"
            exit 1
          fi
          echo "publishing $tag from a workspace at $have"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.publish == 'true'
        with:
          tag_name: ${{ env.VERSION_TAG }}
          files: staging/*
          body_path: NOTES.md
          draft: false
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}

      - name: What a dry run produced
        if: steps.gate.outputs.publish != 'true'
        run: |
          echo "Dry run for ${{ env.VERSION_TAG }}. Nothing was published."
          echo
          cat staging/SHA256SUMS
          echo
          echo "--- release notes ---"
          cat NOTES.md
