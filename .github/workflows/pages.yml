# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publish website/ to GitHub Pages.
#
# Deploying through Actions rather than a branch folder is not a preference:
# "deploy from a branch" only ever offers the repository root or /docs, and
# /docs already holds the whitepaper and the reproducible-build guide. Actions
# can publish any directory, so the site lives in website/ where it belongs.

name: pages

on:
  # When a release finishes, and on nothing else that happens by itself.
  #
  # The site is not only documentation: the download page names the current
  # version, the releases page is generated from CHANGELOG.md, and the verify
  # page describes files that a release publishes. So what is published has to
  # describe what has been released, and nothing else.
  #
  # This used to deploy on a push to `main` as well, which was right while
  # `main` moved only when a release was cut. There is one branch now and work
  # is committed to it every day, so a push trigger would publish a version
  # bump before its release existed, and a download page offering a version
  # nobody can download. The site is published from the commit a release was
  # built from, when that release succeeds; an edit under `website/` reaches
  # the site with the next release.
  #
  # Success only: a release that failed halfway is not something to redeploy
  # the site for. And a release run that published nothing, a dry run, leaves
  # no tag behind, which is how the job below tells the two apart.
  workflow_run:
    workflows: [release]
    types: [completed]

  # Publish the newest release again, by hand: after a failed deploy, or once
  # Pages has been set up. It publishes what was released, like the trigger
  # above, never the tip of `main`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    name: which release to publish
    runs-on: ubuntu-latest
    # A failed release is not a reason to publish. Pressing the button is.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.which.outputs.tag }}
    steps:
      # The whole history, for the tags. Release tags are made by the
      # publishing step of `release.yml`, at the commit it built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # After a release run, the tag at the commit it built: that is the
      # release, and no tag there means the run was a dry run. By hand, the
      # newest release. A prerelease is never the answer either way, because
      # the download page offers releases and an early build is not one.
      - name: Find the release
        id: which
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BUILT" ]; then
            tag="$(git tag --points-at "$BUILT" --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "no release tag names $BUILT: that run was a dry run or a prerelease, so the site stays as it is" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            tag="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "::error::there is no release tag, so there is nothing to publish"
              exit 1
            fi
          fi
          echo "publishing the site from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # The release, by its tag. On a `workflow_run` the default checkout is
      # the tip of `main`, which is the released commit only until the next
      # push, and that is usually minutes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      # The banner and icons are generated, and the site is the most visible
      # place a stale copy would show. Regenerating and diffing here keeps the
      # published artwork honest to the script that claims to produce it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Artwork must match the generator
        run: python assets/generate.py --check

      - name: Sync generated artwork into the site
        run: |
          cp assets/banner.png assets/icon.png assets/icon-32.png website/assets/

      # A privacy tool's website loading a CDN would undercut the whole claim,
      # so the absence of third-party requests is enforced rather than asserted.
      - name: No third-party requests
        run: |
          if grep -rniE '(src|href)="https?://(?!(github\.com|www\.audacityteam\.org|vb-audio\.com|creativecommons\.org|www\.gnu\.org))' \
               --include='*.html' website/ -P; then
            echo "::error::an external asset reference entered the site"
            exit 1
          fi
          if grep -rniE '<script[^>]+src="https?://' --include='*.html' website/; then
            echo "::error::a third-party script entered the site"
            exit 1
          fi
          echo "no third-party assets found"

      - name: Every page must reference the current signing key
        run: |
          want="$(tr -d ' \n' < website/assets/fingerprint.txt | tr 'a-f' 'A-F')"
          missing=0
          for page in website/index.html website/wiki.html website/nojs/index.html; do
            got="$(tr -d ' \n' < "$page" | tr 'a-f' 'A-F')"
            case "$got" in
              *"$want"*) echo "  ok: $page" ;;
              *) echo "::error::$page does not carry the signing-key fingerprint"; missing=1 ;;
            esac
          done
          exit $missing

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
