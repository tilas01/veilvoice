# SPDX-License-Identifier: GPL-3.0-or-later
#
# Keep the old website address answering.
#
# The website moved to tilas01/veilvoice-website and is served from there. This
# address, tilas01.github.io/veilvoice, is written into shipped binaries,
# package metadata and other people's links, so it keeps serving one thing: a
# page at every old path that sends the reader to the same page at the new
# address, with the query string and #fragment kept. tools/site/redirect.py
# writes those pages, and its docstring explains what each one does.
#
# The pages are the same for every release, so this no longer waits for one.
# It runs when the redirect itself changes, or by hand.

name: pages

on:
  push:
    branches: [main]
    paths:
      - tools/site/redirect.py
      - tools/site-tests/redirect.test.js
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read-only by default. Only the deploy job below can publish.
permissions:
  contents: read

# Never cancel a running deploy: a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `configure-pages` reads the site's settings to find its address.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Write the redirecting pages
        run: python tools/site/redirect.py _site

      - name: Check them
        run: node tools/site-tests/redirect.test.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishing is the one write this workflow makes, and `id-token` is how
    # `deploy-pages` proves to Pages which run it came from.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
