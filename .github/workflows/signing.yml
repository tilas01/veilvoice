# SPDX-License-Identifier: GPL-3.0-or-later
#
# Proves that the signing key held in the repository's secrets makes commits
# GitHub shows as Verified for tilas01, before any history is signed with it.
#
# The key is the one release.yml already signs the checksums with,
# GPG_PRIVATE_KEY and GPG_PASSPHRASE. The job imports it, signs one commit on
# a branch of its own, reads GitHub's verdict on that commit and deletes the
# branch. When the key has no identity with tilas01's noreply address, the
# run adds one to its own copy and hands over the public half with it, as
# the artifact signing-public-key, to be registered on his account. The work
# is in tools/repo/signing_check.sh. Run by hand, or by a push that changes it.

name: signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signing.yml'
      - 'tools/repo/signing_check.sh'
      - 'tools/repo/actions_key.sh'

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The write is this job's, granted here rather than to the whole
    # workflow, so a job added later starts with read and has to ask.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sign one commit and ask GitHub whether it verifies
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ]; then echo "GPG_PRIVATE_KEY is not set for the repository." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          bash tools/repo/signing_check.sh
      - name: Hand over the public half, with tilas01's address on it
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signing-public-key
          path: ${{ runner.temp }}/public/veilvoice-signing-key.asc
          if-no-files-found: ignore
