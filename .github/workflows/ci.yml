# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build, lint and test on every supported platform. Windows first, because it
# is the primary target, then macOS and Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A fresh clone must build with no secrets. Nothing here reads one.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # cpal needs ALSA headers, and eframe needs the X11/Wayland stack.
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxkbcommon-x11-0

      - name: Install the pinned toolchain
        run: rustup show   # rust-toolchain.toml selects and installs it

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # Platform-gated code is only compiled on the platform it is gated to, so
      # a helper left ungated -- or gated to the wrong thing -- is invisible
      # everywhere else and an error here. Three separate CI failures in one
      # day came through that gap: an unused `mut`, a dead enum variant, and a
      # `#[cfg(windows)]` that attached to the item above the one it was meant
      # for. Each was clean on the author's Windows machine.
      #
      # This is the same clippy run; it is called out as its own step so that
      # when it fails, the reason is named rather than looking like a generic
      # lint failure on a machine nobody has.
      - name: Clippy (platform-gated code compiles on this platform too)
        run: cargo clippy --workspace --all-targets --locked --tests

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      # Every `cargo` line above takes the default features, and nine of the
      # twelve jobs in the release workflow do not: `cpal` has no backend for
      # the BSDs and cannot be linked into a musl or cross build, so those
      # targets turn `veilvoice-audio`'s `live` feature off. That configuration
      # was built by nothing here, which meant code reachable only with the
      # feature on passed every check on all three platforms and then failed
      # nine release jobs at once.
      #
      # That is not hypothetical. `pub mod record;` lost its
      # `#[cfg(feature = "live")]` when a `playback` module was inserted above
      # it and took the attribute line that had belonged to `record`. The crate
      # then built everywhere CI looked and nowhere it did not, and it was found
      # by dispatching a release two days later. The tool reads the selections
      # out of `release.yml` rather than repeating them, so a target added to
      # that matrix is built here without anybody remembering to.
      #
      # Linux only: the selections are feature sets rather than architectures,
      # and the one that was broken is broken identically on every host.
      - name: Every feature selection a release builds must compile
        if: runner.os == 'Linux'
        run: python tools/audit/features.py --build

  # Two of this project's shipped defects were reachable only where a pointer
  # is 32 bits wide: F-4, an arithmetic overflow, and F-11, an erase loop that
  # never terminated and left the file it was destroying intact. Both were
  # found by reading. Neither was reachable by any campaign in this matrix,
  # because every entry in it is 64-bit, and `docs/AUDIT.md` has named this as
  # the single highest-value change available to CI since the fifth round.
  #
  # Two targets, and only one of them is emulated:
  #
  #   * **i686** binaries run on the runner's own kernel. Nothing is emulated;
  #     `gcc-multilib` is there for the linker and the 32-bit C runtime.
  #   * **armv7** is compiled natively with the cross linker and only the test
  #     binaries are run under `qemu-arm-static`, which needs the cross
  #     sysroot as its loader prefix. Measured locally: the same 682 tests
  #     take 18 seconds of execution on i686 and 88 on armv7, so the emulation
  #     is not what this job costs. Compilation is.
  #
  # **Not the whole workspace, and the reason is packaging rather than
  # correctness.** `veilvoice-audio`, `veilvoice-cli`, `veilvoice-gui` and
  # `veilvoice-video` link ALSA, GTK and X11, and building them for a second
  # architecture means a multiarch sysroot for all of it. The arithmetic, the
  # parsers and the erase loop are in the crates listed below, which are the
  # ones a narrow pointer can break. Saying "the workspace passes on 32-bit"
  # would be the overstatement this project's second rule exists to prevent.
  #
  # Debug rather than release, for the same reason the fuzz job gives: the
  # release profile turns overflow checks off, and an overflow is the thing
  # being looked for.
  narrow:
    name: 32-bit / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            # `libasound2-dev:i386` is what lets `veilvoice-audio` and
            # `veilvoice-video` join the list below. They were excluded for
            # years as "a multiarch sysroot exercise"; for ALSA it is one
            # package and one `--add-architecture`. GTK is the one that is
            # genuinely hard, so `veilvoice-cli` and `veilvoice-gui` are still
            # out.
            packages: gcc-multilib libc6-dev-i386 libasound2-dev:i386
            multiarch: i386
            extra: -p veilvoice-audio -p veilvoice-video
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-static
            multiarch: ""
            extra: ""
            pkgconfig: ""
    env:
      # Read by cargo for the armv7 entry and simply unused by the i686 one,
      # which needs no cross linker and no runner at all.
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm-static
      QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain for ${{ matrix.target }}
        run: |
          if [ -n "${{ matrix.multiarch }}" ]; then
            sudo dpkg --add-architecture ${{ matrix.multiarch }}
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The list is spelled out rather than `--workspace --exclude`, so that a
      # crate added to the workspace is absent here until somebody decides it
      # belongs, rather than joining silently and failing for a linker reason
      # that has nothing to do with 32-bit arithmetic.
      - name: Tests on a 32-bit target
        env:
          # Only set for the entry that has a 32-bit sysroot; empty elsewhere,
          # where pkg-config must keep finding the host's own files.
          PKG_CONFIG_PATH: ${{ matrix.pkgconfig }}
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          cargo test --locked --target ${{ matrix.target }} ${{ matrix.extra }} \
            -p veilvoice-core -p veilvoice-crypto -p veilvoice-meta \
            -p veilvoice-conversation -p veilvoice-check -p veilvoice-workspace \
            -p veilvoice-gnupg \
            -p veilvoice-policy -p veilvoice-decoy -p veilvoice-guard \
            -p veilvoice-verify -p veilvoice-proc -p veilvoice-sentry \
            -p veilvoice-appctl -p veilvoice-update -p veilvoice-watch \
            -p veilvoice-failsafe -p veilvoice-input -p veilvoice-priv \
            -p veilvoice-drivers -p veilvoice-capture -p veilvoice-accel \
            -p veilvoice-setup

  # The generated artwork is committed, so it must match what the generator
  # produces. Otherwise the two drift and the "verifiable from source" claim
  # quietly stops being true.
  #
  # **Two interpreters, and the reason is F-97.** A drawing generated here
  # matched on 3.11 and differed on 3.12, with no change to the source: 3.12
  # gave `sum` compensated summation over floats, one box centred a tenth of a
  # pixel further along, and a file committed from one machine stopped matching
  # the generator run on another. A generated file compared byte for byte must
  # not depend on which Python is installed, and the only way to know that is to
  # run it on more than one.
  assets:
    name: generated assets are current (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Compares decoded pixels, not compressed bytes: zlib's output differs
      # between Python builds, so a byte-for-byte diff would fail spuriously
      # while telling us nothing about whether the artwork actually changed.
      - name: Committed artwork must match the generator
        run: python assets/generate.py --check

      # The search index is committed for the same reason and carries the same
      # risk in a sharper form: a stale index does not look broken, it answers
      # questions confidently about code that no longer looks like that. The
      # generator is deterministic, so this is a byte comparison.
      #
      # `fetch-depth` matters here -- the generator walks `git ls-files`, so a
      # checkout missing files would produce a smaller index and "fail" for a
      # reason that has nothing to do with the index. actions/checkout@v4 gives
      # a complete working tree, which is what this needs.
      - name: Committed search index must match the repository
        run: python tools/search-index/generate.py --check

      # The per-crate and per-file documentation is generated from the doc
      # comments in the source, so a comment edited without regenerating leaves
      # 287 files describing code that has moved on. That is finding F-41 --
      # generated output drifting from its generator, silently -- and it is the
      # reason this documentation is generated rather than written. The check
      # also sweeps for files the generator no longer produces, so a deleted
      # module cannot leave its page behind describing something that is gone.
      - name: Committed documentation must match the source
        run: python tools/docs/generate.py --check

      # The per-section pages are derived from website/index.html, so editing
      # a section without regenerating leaves five pages describing a front
      # page that has moved on -- the F-41 shape again, in a fifth place.
      - name: Committed section pages must match the front page
        run: python tools/site/split.py --check

      # The roadmap page and its picture are generated from ROADMAP.md, so a
      # marker whose status changes without regenerating leaves the published
      # roadmap disagreeing with the roadmap -- the F-41 shape a sixth time, and
      # the one place it is a claim about what is finished. `tools/verify.py`
      # has run this check since the page existed; CI did not, so a stale
      # roadmap was the one generated output that could pass here.
      - name: Committed roadmap must match ROADMAP.md
        run: python tools/site/roadmap.py --check

      # The functional line count appears in README.md, in docs/MEASURED.md and
      # in 28 crate documents, all of them written by one counter. A counter is
      # a small thing that is easy to get subtly wrong -- `//` inside a string
      # literal is not a comment, and Rust block comments nest -- so it is
      # checked against the cases it has to get right before any of those
      # numbers are believed. The site suite compares the numbers themselves
      # against `docs/MEASURED.md`; this checks the tool that measured them.
      - name: The line counter must be right about what a line is
        run: python tools/loc/count.py --self-test

      # Ten more guards that existed and did not fail a build.
      #
      # Every one of these has a `--check`, every one was run by hand before a
      # release, and none of them was here. That is the F-41 shape again, one
      # level up: not a generated file drifting, but the *check for* a drifting
      # file being advisory. Three of them caught real staleness in the round
      # that added this block, which is how the gap was noticed at all:
      #
      #   * `demo.py` found two new tabs with no screenshot and no caption,
      #   * `sources.py` found generated source pages behind their source,
      #   * `terminal.py` found drawings disagreeing with the text they came
      #     from.
      #
      # A run that catches drift only when somebody remembers to look is a run
      # that catches drift eventually. None of these needs a built binary, so
      # they belong in this job rather than one that waits on a compile.
      - name: Generated source pages must match the source
        run: python tools/docs/sources.py --check

      - name: The releases page must match CHANGELOG.md
        run: python tools/site/releases.py --check

      - name: The walkthrough must match the tabs and commands that exist
        run: python tools/site/demo.py --check

      - name: Screenshots must be trimmed, fitted and rounded
        run: |
          python tools/shots/crop.py --check
          python tools/shots/fit.py --check
          python tools/shots/round.py --check
          python tools/shots/attrs.py --check

      - name: Terminal drawings must match their captured text
        run: python tools/shots/terminal.py --check

      - name: Every copy of the version must agree with the workspace
        run: python tools/release/version.py --check

      - name: Packaging definitions must match what a release publishes
        run: python tools/release/packaging.py --check

      # Marker 126. A dependency is code this project ships and does not
      # review, build time on every machine that compiles this, and one more
      # thing that has to work on the BSDs and the 32-bit targets. One sentence
      # where it is declared, or it does not go in. The day this was written it
      # found three that no line of code referred to.
      - name: Every dependency must say what it is for
        run: python tools/audit/dependencies.py

      # And the other half of the question. Saying what a dependency is for
      # does not make anything watch it: a crate outside the workspace, or a
      # second workflow directory, falls outside every Dependabot entry and
      # stops being monitored without anything saying so.
      - name: Every manifest must be covered by a Dependabot entry
        run: python tools/audit/dependabot.py

      # F-170. A release is a claim that these binaries came from this source,
      # and the tag is the load-bearing part of it. Creating a release for a
      # tag that does not exist yet makes GitHub create the tag, and with no
      # `target_commitish` it creates it at the default branch rather than at
      # the commit the run built. v0.1.20 and v0.1.21 were both tagged that
      # way. This reads the publishing step and fails if it stops naming the
      # commit, or if it stops refusing to publish notes it could not read.
      - name: The release step must tag the commit it built
        run: python tools/audit/publishing.py

  # The site's Markdown renderer decides what `js/repo.js` is allowed to put
  # into the page via `innerHTML`, so it is a security boundary and is tested
  # like one. No framework and no package.json: a test suite that pulls a
  # hundred packages off a registry is a supply chain nobody has read, which is
  # the same argument the site itself makes for not loading a CDN.
  site:
    name: website tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Characters, structure, rendering, hostile input, scroll reveal
        run: node tools/site-tests/run.js
      # A longer randomised campaign than the per-commit default. Still not a
      # coverage-guided fuzzer, and `docs/AUDIT.md` does not pretend otherwise.
      - name: Extended hostile-markdown campaign
        run: MD_FUZZ_ROUNDS=200000 node tools/site-tests/markdown.hostile.test.js

  # The container header, the app-lock file and the RIFF chunk walker all parse
  # input an attacker chooses. The per-commit `cargo test` runs a short campaign
  # against each; this runs a long one, because the bugs these found, an
  # Argon2 parallelism overflow and an unbounded memory cost, were both
  # reachable from a file somebody sends you.
  fuzz:
    name: parser campaigns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Debug, not release: the release profile disables overflow checks, and
      # an arithmetic overflow on hostile input is exactly what is being looked
      # for here.
      - name: Container, app-lock and WAV parsers
        env:
          VEILVOICE_FUZZ_ROUNDS: 1000000
        run: |
          cargo test -p veilvoice-crypto --test parser_fuzz --locked
          cargo test -p veilvoice-meta --test wav_fuzz --locked
          cargo test -p veilvoice-core --test hostile_audio --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # A privacy tool that phones home is a broken privacy tool. This is a coarse
  # check, not a proof, but it catches an accidental HTTP client landing in the
  # dependency graph.
  offline:
    name: no network dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Fail if a networking crate appears in the tree
        run: |
          cargo tree --workspace --edges normal --prefix none --format '{p}' \
            | sort -u > /tmp/deps.txt

          # 1. HTTP and WebSocket clients. No exceptions, ever: this is the
          #    claim the front page makes and the one a reader checks first.
          if grep -Eiq '^(reqwest|hyper|curl|ureq|tungstenite|isahc|surf|attohttpc) ' /tmp/deps.txt; then
            echo "::error::an HTTP or WebSocket client entered the dependency graph"
            grep -Ei '^(reqwest|hyper|curl|ureq|tungstenite|isahc|surf|attohttpc) ' /tmp/deps.txt
            exit 1
          fi

          # 2. Crates that can open a socket at all.
          #
          #    This step used to check only the list above and then print "no
          #    networking crates found", which is a broader sentence than the
          #    check behind it. Five socket-capable crates are in the graph and
          #    always have been, all of them reached through the *window*:
          #
          #      tokio, mio, socket2   the file dialog (`rfd`) reaches the XDG
          #                            desktop portal through `ashpd` and
          #                            `zbus`, which speak D-Bus over a Unix
          #                            socket; `tokio` brings its socket
          #                            primitives whether or not a TCP one is
          #                            ever opened
          #      polling               `calloop`'s epoll/kqueue wrapper, under
          #                            `winit`'s Wayland event loop
          #      calloop-wayland-source  the Wayland display connection itself,
          #                            also a Unix socket
          #
          #    None of them is reachable from the command line, which links no
          #    window. VeilVoice's own code names no network API anywhere --
          #    `std::net`, `TcpStream`, `UdpSocket` and `SocketAddr` appear
          #    nowhere in `crates/`. But a reader checking the claim the way
          #    this project invites them to would find these five and read
          #    nothing about them, which is the defect this fixes.
          #
          #    The set is pinned rather than allowlisted. A *new* socket-capable
          #    crate, or one of these disappearing, fails this job and a person
          #    looks at why. A list that grows silently is not a check.
          expected=$(printf '%s\n' calloop-wayland-source mio polling socket2 tokio)
          found=$(grep -Eio '^(mio|socket2|tokio|async-std|smol|polling|calloop-wayland-source) ' /tmp/deps.txt \
            | tr -d ' ' | sort -u)
          if [ "$found" != "$expected" ]; then
            echo "::error::the set of socket-capable crates changed"
            echo "expected:"; printf '%s\n' "$expected"
            echo "found:"; printf '%s\n' "$found"
            echo "If this is deliberate, update this list and say in docs/AUDIT.md what"
            echo "the new crate is for and what it talks to."
            exit 1
          fi

          echo "no HTTP or WebSocket client; the five socket-capable crates are the expected ones"

      # 3. The source names no network API.
      #
      #    The comment above has claimed since it was written that
      #    "`std::net`, `TcpStream`, `UdpSocket` and `SocketAddr` appear
      #    nowhere in `crates/`". That was true and it was a *comment*: a
      #    sentence a reader is asked to believe, sitting inside a job whose
      #    whole purpose is to replace belief with a check. This is the check.
      #
      #    The two matches that are allowed are tests which forbid these very
      #    words, in the crash reporter and in the dependency report. A test
      #    that names the thing it prohibits is not the thing.
      - name: Fail if VeilVoice's own source names a network API
        run: |
          set -euo pipefail
          PATTERN='std::net|TcpStream|TcpListener|UdpSocket|SocketAddr|to_socket_addrs|getaddrinfo'
          hits=$(grep -rInE "$PATTERN" --include='*.rs' crates/ \
            | grep -v 'crates/veilvoice-gui/src/crashreport.rs' \
            | grep -v 'crates/veilvoice-verify/src/deps.rs' || true)
          if [ -n "$hits" ]; then
            echo "::error::VeilVoice's own code names a network API"
            echo "$hits"
            exit 1
          fi
          echo "no network API named anywhere in crates/"

  # Everything above reasons about the *source* and the dependency graph. This
  # job asks the built program itself, three ways, because a reader who does
  # not trust the author should not have to trust the author's reading either.
  #
  #   1. What the binary imports. A program that cannot call `socket` or
  #      `connect` cannot open one, whatever its source says.
  #   2. What it does with no network at all. `unshare -n` gives the process an
  #      empty network namespace: no interfaces, not even loopback. A program
  #      that needs the network fails there.
  #   3. What syscalls it actually makes, under `strace`.
  #
  # The command line and the window are checked separately and claimed
  # separately, because they are not the same program and the honest statements
  # about them differ. The command line links no window and opens nothing. The
  # window talks to the display server and the desktop portal, which are local
  # sockets, and the claim there is the precise one: every socket it opens is
  # `AF_UNIX`, and it never asks for an internet socket.
  offline-runtime:
    name: the built program opens no network socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install the windowing headers and the tracers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxkbcommon-x11-0 strace xvfb

      - name: Build both binaries
        run: cargo build --release --locked -p veilvoice-cli -p veilvoice-gui

      # 1. Imports.
      #
      #    `socketpair` is the one that is allowed, and it is worth saying why
      #    rather than listing it: it creates a connected pair of `AF_UNIX`
      #    descriptors inside this process's own address space. It takes no
      #    address, reaches no host, and is what the standard library uses to
      #    talk between a parent and a child. It cannot carry a byte off the
      #    machine.
      - name: The command line imports no network function
        run: |
          set -euo pipefail
          found=$(nm -D --undefined-only target/release/veilvoice \
            | grep -oiE '\b(socket|connect|getaddrinfo|gethostbyname|sendto|recvfrom|bind|listen|accept)\b' \
            | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::the command line binary imports a network function"
            echo "$found"
            exit 1
          fi
          echo "veilvoice imports no network function (socketpair, which is AF_UNIX and local, is not one)"

      # 2. No network namespace at all.
      #
      #    `unshare -rn` on its own is not enough here. It asks for a *user*
      #    namespace so that an ordinary account can make a network one, and
      #    Ubuntu 24.04 refuses unprivileged user namespaces by default
      #    (`kernel.apparmor_restrict_unprivileged_userns`). The step failed
      #    with "write failed /proc/self/uid_map: Operation not permitted" on
      #    every run since it was added, and because it failed early the two
      #    steps after it were skipped: the job proved nothing at all while
      #    looking like it was proving three things.
      #
      #    So the namespace is obtained whichever way this kernel allows, and
      #    the program is dropped back to the ordinary account inside it, so
      #    what is measured is still VeilVoice as somebody actually runs it.
      #    If no way works, this fails: a guard that quietly skips is worse
      #    than no guard, because it is green.
      - name: The command line does its work with no network namespace
        run: |
          set -euo pipefail

          # Best effort, and not depended on: where the restriction can be
          # lifted, the unprivileged path below is the one that runs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            >/dev/null 2>&1 || true

          me="$(id -u):$(id -g)"
          if unshare -rn true 2>/dev/null; then
            empty_netns() { unshare -rn "$@"; }
            echo "empty network namespace: unprivileged, through a user namespace"
          elif sudo unshare -n true 2>/dev/null; then
            empty_netns() {
              sudo unshare -n -- setpriv --reuid="${me%%:*}" --regid="${me##*:}" \
                --clear-groups "$@"
            }
            echo "empty network namespace: made as root, program dropped back to $me"
          else
            echo "::error::this runner will not make an empty network namespace, so nothing here is proved"
            exit 1
          fi

          python3 - <<'WAV'
          import struct, math, io
          rate, seconds = 48000, 2
          d = io.BytesIO()
          for i in range(rate * seconds):
              d.write(struct.pack('<h', int(9000 * math.sin(i / 40.0))))
          raw = d.getvalue()
          open('/tmp/offline.wav', 'wb').write(
              b'RIFF' + struct.pack('<I', 36 + len(raw)) + b'WAVEfmt ' +
              struct.pack('<IHHIIHH', 16, 1, 1, rate, rate * 2, 2, 16) +
              b'data' + struct.pack('<I', len(raw)) + raw)
          WAV
          empty_netns target/release/veilvoice anonymise /tmp/offline.wav \
            -o /tmp/offline.veiled.wav --encrypt false --yes
          test -s /tmp/offline.veiled.wav
          echo "de-identified a recording inside an empty network namespace"

      # 3. Syscalls.
      - name: The command line makes no network syscall
        run: |
          set -euo pipefail
          for args in \
            "anonymise /tmp/offline.wav -o /tmp/traced.wav --encrypt false --yes" \
            "verify --help" \
            "--version"; do
            strace -f -e trace=%network -o /tmp/trace.txt \
              target/release/veilvoice $args >/dev/null 2>&1 || true
            # strace writes one "+++ exited +++" line per process even when it
            # traced nothing, so the test is for syscalls rather than for lines.
            calls=$(grep -cE '^[0-9]+ +(socket|connect|bind|listen|accept|sendto|recvfrom|sendmsg|recvmsg)' /tmp/trace.txt || true)
            if [ "$calls" != "0" ]; then
              echo "::error::veilvoice $args made $calls network syscall(s)"
              cat /tmp/trace.txt
              exit 1
            fi
          done
          echo "no network syscall from any command line invocation"

      # 4. The window, and the precise claim about it.
      - name: The window opens only local sockets, never an internet one
        run: |
          set -euo pipefail
          Xvfb :95 -screen 0 800x600x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:95 LIBGL_ALWAYS_SOFTWARE=1 timeout 30 \
            strace -f -e trace=%network -o /tmp/gui-trace.txt \
            target/release/veilvoice-gui --tab about --size 800x600 >/dev/null 2>&1 || true

          if [ ! -s /tmp/gui-trace.txt ]; then
            echo "::error::the window produced no trace, so this proved nothing"
            exit 1
          fi

          # Any internet socket at all, asked for or connected to, fails.
          if grep -q 'AF_INET' /tmp/gui-trace.txt; then
            echo "::error::the window asked for an internet socket"
            grep 'AF_INET' /tmp/gui-trace.txt | head -20
            exit 1
          fi

          families=$(grep -oE 'socket\(AF_[A-Z0-9_]+' /tmp/gui-trace.txt \
            | grep -oE 'AF_[A-Z0-9_]+' | sort -u | tr '\n' ' ')
          echo "socket families the window asked for: ${families:-none}"
          echo "no AF_INET or AF_INET6 anywhere: the window's sockets are local"

  # `rsa` is in the dependency graph through `pgp`, and it carries
  # RUSTSEC-2023-0071 -- the Marvin attack, key recovery through a timing side
  # channel, with no fixed version available. `.cargo/audit.toml` accepts it on
  # one specific ground: the advisory is about RSA *private key* operations, and
  # VeilVoice only ever verifies a signature against a public key compiled into
  # it. There is no secret for a timing oracle to leak.
  #
  # That is an argument about how the crate is used, not about the crate, so it
  # has to be enforced rather than believed. If a secret-key or decryption API
  # ever appears, this fails and the acceptance has to be re-argued.
  #
  # Both crates that reach `pgp` are checked, and the list is derived from the
  # manifests rather than written here: the signature arithmetic moved from
  # `veilvoice-verify` into `veilvoice-check` so the desktop application could
  # share it, and for a while afterwards this job still grepped only the crate
  # it had started in. A guard whose scope is narrower than the claim it
  # enforces is worse than no guard, because it is green.
  rsa-usage:
    name: no RSA private-key operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any crate reaching pgp gains a private-key code path
        run: |
          set -euo pipefail
          PATTERN='SignedSecretKey|SecretKeyParams|decrypt|sign_binary_data|sign_text_data'

          # Every crate whose manifest names `pgp`, found rather than listed.
          mapfile -t CRATES < <(grep -l '^pgp = ' crates/*/Cargo.toml | xargs -n1 dirname)
          if [ "${#CRATES[@]}" -eq 0 ]; then
            echo "::error::no crate depends on pgp any more; this job is checking nothing."
            exit 1
          fi
          echo "crates reaching pgp: ${CRATES[*]}"

          failed=0
          for crate in "${CRATES[@]}"; do
            if grep -RnE "$PATTERN" "$crate/src/"; then
              echo "::error::$crate appears to perform a private-key operation."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "RUSTSEC-2023-0071 is accepted in .cargo/audit.toml only because it does not."
            exit 1
          fi
          echo "verification only: no secret-key or decryption API in ${CRATES[*]}"
