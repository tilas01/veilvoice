# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build, lint and test on every supported platform. Windows first, because it
# is the primary target, then macOS and Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A fresh clone must build with no secrets. Nothing here reads one.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # cpal needs ALSA headers, and eframe needs the X11/Wayland stack.
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Install the pinned toolchain
        run: rustup show   # rust-toolchain.toml selects and installs it

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # Platform-gated code is only compiled on the platform it is gated to, so
      # a helper left ungated -- or gated to the wrong thing -- is invisible
      # everywhere else and an error here. Three separate CI failures in one
      # day came through that gap: an unused `mut`, a dead enum variant, and a
      # `#[cfg(windows)]` that attached to the item above the one it was meant
      # for. Each was clean on the author's Windows machine.
      #
      # This is the same clippy run; it is called out as its own step so that
      # when it fails, the reason is named rather than looking like a generic
      # lint failure on a machine nobody has.
      - name: Clippy (platform-gated code compiles on this platform too)
        run: cargo clippy --workspace --all-targets --locked --tests

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

  # Two of this project's shipped defects were reachable only where a pointer
  # is 32 bits wide: F-4, an arithmetic overflow, and F-11, an erase loop that
  # never terminated and left the file it was destroying intact. Both were
  # found by reading. Neither was reachable by any campaign in this matrix,
  # because every entry in it is 64-bit, and `docs/AUDIT.md` has named this as
  # the single highest-value change available to CI since the fifth round.
  #
  # Two targets, and only one of them is emulated:
  #
  #   * **i686** binaries run on the runner's own kernel. Nothing is emulated;
  #     `gcc-multilib` is there for the linker and the 32-bit C runtime.
  #   * **armv7** is compiled natively with the cross linker and only the test
  #     binaries are run under `qemu-arm-static`, which needs the cross
  #     sysroot as its loader prefix. Measured locally: the same 682 tests
  #     take 18 seconds of execution on i686 and 88 on armv7, so the emulation
  #     is not what this job costs. Compilation is.
  #
  # **Not the whole workspace, and the reason is packaging rather than
  # correctness.** `veilvoice-audio`, `veilvoice-cli`, `veilvoice-gui` and
  # `veilvoice-video` link ALSA, GTK and X11, and building them for a second
  # architecture means a multiarch sysroot for all of it. The arithmetic, the
  # parsers and the erase loop are in the crates listed below, which are the
  # ones a narrow pointer can break. Saying "the workspace passes on 32-bit"
  # would be the overstatement this project's second rule exists to prevent.
  #
  # Debug rather than release, for the same reason the fuzz job gives: the
  # release profile turns overflow checks off, and an overflow is the thing
  # being looked for.
  narrow:
    name: 32-bit / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            # `libasound2-dev:i386` is what lets `veilvoice-audio` and
            # `veilvoice-video` join the list below. They were excluded for
            # years as "a multiarch sysroot exercise"; for ALSA it is one
            # package and one `--add-architecture`. GTK is the one that is
            # genuinely hard, so `veilvoice-cli` and `veilvoice-gui` are still
            # out.
            packages: gcc-multilib libc6-dev-i386 libasound2-dev:i386
            multiarch: i386
            extra: -p veilvoice-audio -p veilvoice-video
            pkgconfig: /usr/lib/i386-linux-gnu/pkgconfig
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-static
            multiarch: ""
            extra: ""
            pkgconfig: ""
    env:
      # Read by cargo for the armv7 entry and simply unused by the i686 one,
      # which needs no cross linker and no runner at all.
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm-static
      QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain for ${{ matrix.target }}
        run: |
          if [ -n "${{ matrix.multiarch }}" ]; then
            sudo dpkg --add-architecture ${{ matrix.multiarch }}
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install the pinned toolchain
        run: rustup show

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The list is spelled out rather than `--workspace --exclude`, so that a
      # crate added to the workspace is absent here until somebody decides it
      # belongs, rather than joining silently and failing for a linker reason
      # that has nothing to do with 32-bit arithmetic.
      - name: Tests on a 32-bit target
        env:
          # Only set for the entry that has a 32-bit sysroot; empty elsewhere,
          # where pkg-config must keep finding the host's own files.
          PKG_CONFIG_PATH: ${{ matrix.pkgconfig }}
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          cargo test --locked --target ${{ matrix.target }} ${{ matrix.extra }} \
            -p veilvoice-core -p veilvoice-crypto -p veilvoice-meta \
            -p veilvoice-conversation -p veilvoice-check -p veilvoice-workspace \
            -p veilvoice-gnupg \
            -p veilvoice-policy -p veilvoice-decoy -p veilvoice-guard \
            -p veilvoice-verify -p veilvoice-proc -p veilvoice-sentry \
            -p veilvoice-appctl -p veilvoice-update -p veilvoice-watch \
            -p veilvoice-failsafe -p veilvoice-input -p veilvoice-priv \
            -p veilvoice-drivers -p veilvoice-capture -p veilvoice-accel \
            -p veilvoice-setup

  # The generated artwork is committed, so it must match what the generator
  # produces. Otherwise the two drift and the "verifiable from source" claim
  # quietly stops being true.
  #
  # **Two interpreters, and the reason is F-97.** A drawing generated here
  # matched on 3.11 and differed on 3.12, with no change to the source: 3.12
  # gave `sum` compensated summation over floats, one box centred a tenth of a
  # pixel further along, and a file committed from one machine stopped matching
  # the generator run on another. A generated file compared byte for byte must
  # not depend on which Python is installed, and the only way to know that is to
  # run it on more than one.
  assets:
    name: generated assets are current (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Compares decoded pixels, not compressed bytes: zlib's output differs
      # between Python builds, so a byte-for-byte diff would fail spuriously
      # while telling us nothing about whether the artwork actually changed.
      - name: Committed artwork must match the generator
        run: python assets/generate.py --check

      # The search index is committed for the same reason and carries the same
      # risk in a sharper form: a stale index does not look broken, it answers
      # questions confidently about code that no longer looks like that. The
      # generator is deterministic, so this is a byte comparison.
      #
      # `fetch-depth` matters here -- the generator walks `git ls-files`, so a
      # checkout missing files would produce a smaller index and "fail" for a
      # reason that has nothing to do with the index. actions/checkout@v4 gives
      # a complete working tree, which is what this needs.
      - name: Committed search index must match the repository
        run: python tools/search-index/generate.py --check

      # The per-crate and per-file documentation is generated from the doc
      # comments in the source, so a comment edited without regenerating leaves
      # 287 files describing code that has moved on. That is finding F-41 --
      # generated output drifting from its generator, silently -- and it is the
      # reason this documentation is generated rather than written. The check
      # also sweeps for files the generator no longer produces, so a deleted
      # module cannot leave its page behind describing something that is gone.
      - name: Committed documentation must match the source
        run: python tools/docs/generate.py --check

      # The per-section pages are derived from website/index.html, so editing
      # a section without regenerating leaves five pages describing a front
      # page that has moved on -- the F-41 shape again, in a fifth place.
      - name: Committed section pages must match the front page
        run: python tools/site/split.py --check

  # The site's Markdown renderer decides what `js/repo.js` is allowed to put
  # into the page via `innerHTML`, so it is a security boundary and is tested
  # like one. No framework and no package.json: a test suite that pulls a
  # hundred packages off a registry is a supply chain nobody has read, which is
  # the same argument the site itself makes for not loading a CDN.
  site:
    name: website tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Characters, structure, rendering, hostile input, scroll reveal
        run: node tools/site-tests/run.js
      # A longer randomised campaign than the per-commit default. Still not a
      # coverage-guided fuzzer, and `docs/AUDIT.md` does not pretend otherwise.
      - name: Extended hostile-markdown campaign
        run: MD_FUZZ_ROUNDS=200000 node tools/site-tests/markdown.hostile.test.js

  # The container header, the app-lock file and the RIFF chunk walker all parse
  # input an attacker chooses. The per-commit `cargo test` runs a short campaign
  # against each; this runs a long one, because the bugs these found, an
  # Argon2 parallelism overflow and an unbounded memory cost, were both
  # reachable from a file somebody sends you.
  fuzz:
    name: parser campaigns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Debug, not release: the release profile disables overflow checks, and
      # an arithmetic overflow on hostile input is exactly what is being looked
      # for here.
      - name: Container, app-lock and WAV parsers
        env:
          VEILVOICE_FUZZ_ROUNDS: 1000000
        run: |
          cargo test -p veilvoice-crypto --test parser_fuzz --locked
          cargo test -p veilvoice-meta --test wav_fuzz --locked
          cargo test -p veilvoice-core --test hostile_audio --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # A privacy tool that phones home is a broken privacy tool. This is a coarse
  # check, not a proof, but it catches an accidental HTTP client landing in the
  # dependency graph.
  offline:
    name: no network dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Fail if a networking crate appears in the tree
        run: |
          cargo tree --workspace --edges normal --prefix none --format '{p}' \
            | sort -u > /tmp/deps.txt
          # reqwest/hyper/curl/tungstenite have no business in this project.
          if grep -Eiq '^(reqwest|hyper|curl|ureq|tungstenite|isahc|surf) ' /tmp/deps.txt; then
            echo "::error::an HTTP or WebSocket client entered the dependency graph"
            grep -Ei '^(reqwest|hyper|curl|ureq|tungstenite|isahc|surf) ' /tmp/deps.txt
            exit 1
          fi
          echo "no networking crates found"

  # `rsa` is in the dependency graph through `pgp`, and it carries
  # RUSTSEC-2023-0071 -- the Marvin attack, key recovery through a timing side
  # channel, with no fixed version available. `.cargo/audit.toml` accepts it on
  # one specific ground: the advisory is about RSA *private key* operations, and
  # `veilvoice-verify` only ever verifies a signature against a public key
  # compiled into it. There is no secret for a timing oracle to leak.
  #
  # That is an argument about how the crate is used, not about the crate, so it
  # has to be enforced rather than believed. If a secret-key or decryption API
  # ever appears, this fails and the acceptance has to be re-argued.
  rsa-usage:
    name: no RSA private-key operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the verifier gains a private-key code path
        run: |
          PATTERN='SignedSecretKey|SecretKeyParams|decrypt|sign_binary_data|sign_text_data'
          if grep -RnE "$PATTERN" crates/veilvoice-verify/src/; then
            echo "::error::veilvoice-verify appears to perform a private-key operation."
            echo "RUSTSEC-2023-0071 is accepted in .cargo/audit.toml only because it does not."
            exit 1
          fi
          echo "verification only: no secret-key or decryption API in the verifier"
