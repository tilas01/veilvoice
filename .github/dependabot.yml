# SPDX-License-Identifier: GPL-3.0-or-later
#
# VeilVoice dependency monitoring.
#
# # What this repository actually depends on
#
# Two ecosystems, and only two. Every third-party line of code that ships in a
# VeilVoice binary comes in through Cargo; everything that runs in CI comes in
# through an action. There is no npm, bundler or pip ecosystem here: the
# website's JavaScript and the site tests use Node's own built-in modules
# (`fs`, `path`, `vm`, `child_process`) and nothing else, and every script under
# `tools/` and `assets/` is pure standard-library Python. A `package.json` or a
# `Gemfile` added here would declare no dependencies, and a manifest that says
# nothing is one more file that has to be kept true.
#
# `Cargo.toml` is this project's package.json. There are 15 of them: the
# workspace root, 13 crates, and `fuzz/`.
#
# # This file is checked rather than remembered
#
# `tools/audit/dependabot.py` reads this file and the tree beside it, and fails
# the build if a manifest directory exists that no entry below covers. A crate
# added outside the workspace, or a second workflow directory, would otherwise
# stop being monitored silently, which is the kind of gap that is noticed a
# year later. It runs in CI beside `tools/audit/dependencies.py`.

# # Why an upgrade here cannot break the project abruptly
#
# Four things hold at once, and the point is that no single one of them is
# trusted on its own:
#
#   1. **Nothing merges itself.** There is no auto-merge. Every pull request
#      below waits for a person, and CI has to be green before that person can
#      sensibly say yes.
#   2. **CI is the gate, and it is not a smoke test.** Thirteen jobs: the
#      workspace built and tested on Linux, macOS and Windows, two 32-bit
#      targets, the offline proof, the parser campaigns, the advisory scan and
#      every generated file checked against its source.
#   3. **A major is never grouped.** Minor and patch arrive batched, because
#      twenty of those a week is noise. A major arrives alone, because it can
#      change behaviour, drop a platform or raise the minimum Rust version, and
#      this project builds on the BSDs and on 32-bit targets where that matters
#      more than it usually does. `cpal` 0.15 to 0.18 was thirty-seven compile
#      errors across four files in the realtime path: exactly the kind of thing
#      that must arrive as its own decision.
#   4. **A decision already made does not reopen every week.** The `ignore`
#      list below is majors that have been considered and refused, each with
#      the reason written where the dependency is declared. Minors and patches
#      still arrive for every one of them, which is the half that matters for
#      security: an advisory is almost always fixed in a patch.
#
# The fourth point is the one with a sharp edge, so it is worth being exact:
# an `ignore` entry suppresses the security update for that dependency at that
# update type too. That is why every entry below is scoped to
# `version-update:semver-major` and never to a whole dependency. A bare
# `dependency-name` with no `update-types` would silence the advisory as well,
# which is the opposite of what this file is for.

version: 2

updates:
  # ---- Cargo, the workspace ----
  #
  # One entry covers the root manifest and every member crate: Cargo is a
  # workspace-aware ecosystem, so Dependabot resolves `Cargo.lock` from the
  # root and sees all 27 members through it. A separate entry per crate would
  # open 27 pull requests for one bumped version.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    # Ten is high enough that a quiet week clears the queue and low enough that
    # a noisy one does not bury the repository. Every one of these is code that
    # ships in a signed binary and is read before it is merged.
    open-pull-requests-limit: 10
    commit-message:
      # Matches this repository's own subject style: a lowercase area, a colon,
      # then what changed. `deps` rather than `chore`, because a dependency
      # bump is a change to what this program ships, not housekeeping.
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: scope
    groups:
      # Patch and minor bumps arrive as one pull request per week rather than
      # as twenty. A group that fails CI is bisected by hand, which is the
      # trade: fewer reviews, and a slower answer on the rare week one breaks.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # A major bump is its own pull request, ungrouped, because it is a decision
    # rather than an update: it can change behaviour, drop a platform, or raise
    # the minimum Rust version, and this project builds on the BSDs and on
    # 32-bit targets where that matters more than it usually does.
    #
    # Ten of those decisions are already made, and made together. The
    # cryptographic line is held on the generation `pgp` 0.20 uses; the reason
    # is written in full beside `argon2` in `crates/veilvoice-crypto/Cargo.toml`.
    # Their majors are ignored so the same pull requests do not reopen every
    # week; minors and patches still arrive. Remove these the day `pgp` moves
    # or the signature check stops needing it (roadmap item 149).
    ignore:
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chacha20poly1305"
        update-types: ["version-update:semver-major"]
      - dependency-name: "argon2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "x25519-dalek"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ml-kem"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major"]
      # Not part of the cryptographic generation above, and refused on its own
      # grounds: `region` 4 made `region::unlock` an `unsafe` function, and this
      # crate unlocks explicitly rather than through the RAII guard, for the
      # reason `veilvoice-crypto`'s `amnesia` module gives at length. Taking it
      # would put an `unsafe` block into a crate whose `#![forbid(unsafe_code)]`
      # is a promise made on the website, to buy `no_std` this project does not
      # use. The full argument is beside the dependency in
      # `crates/veilvoice-crypto/Cargo.toml`. Patches and minors still arrive.
      - dependency-name: "region"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - rust

  # ---- Cargo, the fuzzing package ----
  #
  # `fuzz/` is deliberately excluded from the workspace (it needs nightly and
  # its own profile), so the entry above does not reach it. Without this entry
  # the fuzz targets would silently stop being monitored, which is the kind of
  # gap that is only noticed when something in it has been unmaintained for a
  # year. `tools/audit/dependencies.py` includes it for the same reason.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(fuzz)"
      include: scope
    labels:
      - dependencies
      - rust
      - fuzzing

  # ---- GitHub Actions ----
  #
  # The actions in `.github/workflows/` run with a token that can write to this
  # repository and, on the release workflow, publish signed artefacts. An
  # action pinned to a tag that has been moved is a supply-chain problem with
  # this project's signing in its blast radius, so these are monitored on the
  # same terms as the code.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      # Same rule as the crates: batched when it is routine, alone when it is a
      # decision. A major version of an action can change its inputs or its
      # outputs, and these actions check out the code, build it and publish
      # signed artefacts, so one arriving inside a group of eight is one nobody
      # reads. Majors are left ungrouped deliberately.
      actions:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
