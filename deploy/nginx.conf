# Serve the VeilVoice website under nginx, the same files GitHub Pages serves.
#
# This is the "host it properly" answer that tools/site/serve.py points at. The
# development script is http.server with a few fixes; this is for somebody who
# wants the site on a real server -- a mirror, an internal copy, a fallback for
# if the repository ever goes down.
#
#   1. Point `root` at the website/ directory of a checkout.
#   2. Include this in your nginx config, or drop it in sites-available and
#      link it, then `nginx -t` and reload.
#
# There is no build step and nothing server-side, because the site has none:
# it is static files, and that is the whole reason it can be trusted and
# mirrored. Any web server that serves a directory does the same job; Caddy,
# Apache and `python3 -m http.server` are all fine. This file just writes the
# few things down for the one server people most often reach for.
#
# SPDX-License-Identifier: GPL-3.0-or-later

server {
    listen              8080;
    listen              [::]:8080;
    server_name         localhost;

    # The document root: the website/ directory of a VeilVoice checkout.
    # Change this to wherever you cloned the repository.
    root                /path/to/veilvoice/website;
    index               index.html;

    # Every link on the site carries its extension, so no clean-URL rewriting
    # is needed -- and adding any would be a way for the local copy to behave
    # differently from the published one, which is the one thing a mirror must
    # not do. A missing file is a 404, served as the site's own page.
    error_page          404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    # The signing key and the hash lists are text, and a browser that offered
    # to "open" them in a helper application rather than showing them would be
    # unhelpful at exactly the wrong moment. Served as plain text, inline.
    location ~* \.(asc|txt)$ {
        default_type    text/plain;
        add_header      Content-Disposition inline;
    }

    # Content types nginx does not always know, pinned so the page behaves the
    # same here as on GitHub Pages.
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        application/xml                       xml;
        text/plain                            txt asc;
    }

    # The site is static and self-contained: it makes no third-party requests,
    # loads no analytics, and needs no scripts from anywhere but itself. This
    # says so to the browser, so a mirror cannot quietly become a place that
    # watches its visitors.
    add_header          Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header          X-Content-Type-Options nosniff always;
    add_header          Referrer-Policy no-referrer always;

    # Short cache. A mirror that pinned a long max-age would keep showing an old
    # fingerprint after the real one rotated, which is the one number on the
    # site that must never be stale.
    location ~* \.(css|js|svg|png|webp|woff2)$ {
        add_header      Cache-Control "public, max-age=300";
    }
    location ~* \.html$ {
        add_header      Cache-Control "no-cache";
    }
}
