<text x="417" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#737aa2" text-anchor="middle">veilvoice --help</text>
<text x="18.0" y="46.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">VeilVoice destroys the biometric voiceprint of a speaker: the pitch, the formants, the timbre</text>
<text x="18.0" y="65.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">and the melody of an accent. It keeps the words clean and transcribable. This command line talks</text>
<text x="18.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">to no servers, ever: the one thing in VeilVoice that reaches the network is the desktop app's</text>
<text x="18.0" y="103.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">check-for-updates button, and it is not here.</text>
<text x="18.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#7aa2f7" xml:space="preserve">Usage: veilvoice &lt;COMMAND&gt;</text>
<text x="18.0" y="179.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Commands:</text>
<text x="18.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  anonymise     De-identify an audio file and write a WAV</text>
<text x="18.0" y="217.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  live          Scramble a microphone live, into a device or a virtual cable</text>
<text x="18.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  record        Record yourself already veiled, straight into an encrypted file</text>
<text x="18.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  devices       List the audio devices this machine offers</text>
<text x="18.0" y="274.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  clean         Strip identifying metadata from an audio or image file, in place</text>
<text x="18.0" y="293.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  encrypt       Encrypt a file into a `.veil` container</text>
<text x="18.0" y="312.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  decrypt       Decrypt a `.veil` container</text>
<text x="18.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  keygen        Generate a hybrid post-quantum key pair</text>
<text x="18.0" y="350.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  guard         Record and check the integrity of VeilVoice's own files</text>
<text x="18.0" y="369.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  lock          Manage the application lock that guards the desktop app</text>
<text x="18.0" y="388.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  watch         Show which applications are using the microphone and camera</text>
<text x="18.0" y="407.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  shred         Securely erase a file, then delete it. Irreversible</text>
<text x="18.0" y="426.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  info          Show version and build information</text>
<text x="18.0" y="445.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  accel         The graphics hardware here, and what it is good for</text>
<text x="18.0" y="464.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  gui           Open the desktop application</text>
<text x="18.0" y="483.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  install       Copy VeilVoice somewhere the system can find it, and add it to PATH</text>
<text x="18.0" y="502.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  uninstall     Undo what `install` did: the PATH entry, the uninstall entry, and the installed</text>
<text x="18.0" y="521.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">                copy</text>
<text x="18.0" y="540.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  policy        Settings fixed so the interface cannot turn them off</text>
<text x="18.0" y="559.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  mandate       The two things VeilVoice insists on, unless you say otherwise</text>
<text x="18.0" y="578.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  conversation  A recording with several people in it: a voice each, and subtitles</text>
<text x="18.0" y="597.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  capture       Which screen recorders are running, and which you meant to run</text>
<text x="18.0" y="616.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  decoy         A second passphrase that opens an empty VeilVoice, and its limits</text>
<text x="18.0" y="635.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  failsafe      The safety catch: what it watches for, and what it cannot do</text>
<text x="18.0" y="654.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  privilege     What VeilVoice is running with, and what that lets it see</text>
<text x="18.0" y="673.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  appctl        Learn what normally runs here, then notice what does not</text>
<text x="18.0" y="692.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  input         What running programs can see your keyboard and mouse</text>
<text x="18.0" y="711.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  sentry        Canaries, and how fast a folder is changing</text>
<text x="18.0" y="730.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  companions    Optional third-party software VeilVoice works with, and whether this machine</text>
<text x="18.0" y="749.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">                already has it</text>
<text x="18.0" y="768.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  verify        Check a download, and what does the checking</text>
<text x="18.0" y="787.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  video         Turn a veiled recording into a video with a black picture</text>
<text x="18.0" y="806.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  import        Take the sound out of a recording made somewhere else</text>
<text x="18.0" y="825.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  volumes       Encrypted volumes this machine has: Cryptomator and VeraCrypt</text>
<text x="18.0" y="844.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  help          Print this message or the help of the given subcommand(s)</text>
<text x="18.0" y="882.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Options:</text>
<text x="18.0" y="901.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -h, --help</text>
<text x="18.0" y="920.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print help (see a summary with '-h')</text>
<text x="18.0" y="958.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -V, --version</text>
<text x="18.0" y="977.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print version</text>
</svg>
