<text x="417" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#737aa2" text-anchor="middle">veilvoice conversation preview --help</text>
<text x="18.0" y="46.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Draw a still of the page, without rendering any audio.</text>
<text x="18.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">The layout, the speaker circles and which voice each speaker becomes -- answered in a second</text>
<text x="18.0" y="103.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">rather than in the length of the recording. With `--ffmpeg` it also prints the command that</text>
<text x="18.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">would turn frames into a video file, and whether `ffmpeg` is on this machine. **It never runs</text>
<text x="18.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">it**: this project ships no codec and starts no program you did not.</text>
<text x="18.0" y="179.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#7aa2f7" xml:space="preserve">Usage: veilvoice conversation preview [OPTIONS] &lt;PLAN&gt;</text>
<text x="18.0" y="217.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Arguments:</text>
<text x="18.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">  &lt;PLAN&gt;</text>
<text x="18.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          The plan file</text>
<text x="18.0" y="293.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">Options:</text>
<text x="18.0" y="312.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --audio &lt;AUDIO&gt;</text>
<text x="18.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          A recording, so the waveform is real rather than flat</text>
<text x="18.0" y="369.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --at &lt;AT&gt;</text>
<text x="18.0" y="388.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Which second of the conversation to draw</text>
<text x="18.0" y="426.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 0]</text>
<text x="18.0" y="464.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -o, --output &lt;OUTPUT&gt;</text>
<text x="18.0" y="483.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Where to write the SVG. Defaults to the plan's name</text>
<text x="18.0" y="521.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --ffmpeg</text>
<text x="18.0" y="540.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print the ffmpeg command, and whether ffmpeg is installed</text>
<text x="18.0" y="578.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --size &lt;SIZE&gt;</text>
<text x="18.0" y="597.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Frame size: monitor, 720p, 1080p, 1440p, 4k, or 1920x1080.</text>
<text x="18.0" y="635.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          This replaces the old `--width` and `--height`, which were two ways to say one thing</text>
<text x="18.0" y="654.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          and could be set to a pair no video can be made from. `monitor` matches this display</text>
<text x="18.0" y="673.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          where the platform will say what it is, and says so and uses 1080p where it will not.</text>
<text x="18.0" y="711.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: monitor]</text>
<text x="18.0" y="749.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --fps &lt;FPS&gt;</text>
<text x="18.0" y="768.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Frames per second for the printed ffmpeg command, from 5 to 60</text>
<text x="18.0" y="806.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 30]</text>
<text x="18.0" y="844.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --padding &lt;PADDING&gt;</text>
<text x="18.0" y="863.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Margin around everything, in pixels</text>
<text x="18.0" y="901.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          [default: 48]</text>
<text x="18.0" y="939.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --background &lt;BACKGROUND&gt;</text>
<text x="18.0" y="958.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          A `#rrggbb` colour, or the path to an image file</text>
<text x="18.0" y="996.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --black</text>
<text x="18.0" y="1015.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Plain black behind everything. Overrides `--background`</text>
<text x="18.0" y="1053.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --theme &lt;THEME&gt;</text>
<text x="18.0" y="1072.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Colour scheme, from the nine the website and the app offer</text>
<text x="18.0" y="1110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">      --one-voice</text>
<text x="18.0" y="1129.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Draw it as if every speaker had the same voice</text>
<text x="18.0" y="1167.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#9ece6a" xml:space="preserve">  -h, --help</text>
<text x="18.0" y="1186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.4" fill="#c0caf5" xml:space="preserve">          Print help (see a summary with '-h')</text>
</svg>
