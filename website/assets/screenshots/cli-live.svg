<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1145" width="834" height="1145" style="max-width:100%;height:auto" role="img" aria-label="scrambling a microphone as it runs">
<!-- GENERATED by tools/shots/terminal.py from assets/screenshots/cli-live.txt. Do not edit. -->
<title>scrambling a microphone as it runs</title>
<rect x="0" y="0" width="834" height="1145" rx="9" fill="#16161e"/>
<rect x="0" y="0" width="834" height="30" rx="9" fill="#1f2335"/>
<rect x="0" y="21" width="834" height="9" fill="#1f2335"/>
<rect x="0.5" y="0.5" width="833" height="1144" rx="9" fill="none" stroke="#2f3549"/>
<circle cx="18" cy="15" r="4.5" fill="#f7768e"/>
<circle cx="34" cy="15" r="4.5" fill="#e0af68"/>
