# VeilVoice — cryptographically-modulated, irreversible voice de-identification.
#
# Workspace root. Every member crate is buildable by anyone with the pinned
# stable toolchain (see rust-toolchain.toml) and NO secrets: `cargo build`
# works on a fresh clone. Release signing / packaging secrets are optional and
# only consumed by CI when present.
#
# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "crates/veilvoice-capture",
    "crates/veilvoice-check",
    "crates/veilvoice-conversation",
    "crates/veilvoice-core",
    "crates/veilvoice-crypto",
    "crates/veilvoice-audio",
    "crates/veilvoice-meta",
    "crates/veilvoice-gui",
    "crates/veilvoice-cli",
    "crates/veilvoice-video",
    "crates/veilvoice-watch",
    "crates/veilvoice-drivers",
    "crates/veilvoice-guard",
    "crates/veilvoice-policy",
    "crates/veilvoice-sentry",
    "crates/veilvoice-setup",
    "crates/veilvoice-update",
    "crates/veilvoice-verify",
]
# `fuzz/` is a cargo-fuzz package and needs nightly plus libFuzzer. Excluding it
# keeps the pinned stable toolchain sufficient for everything else, so a fresh
# clone still builds with `cargo build` and nothing demands nightly. See
# fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.12"
edition = "2021"
# The oldest Rust this actually compiles on, measured rather than assumed.
#
# This said 1.96 -- the version that happened to be current when it was
# written -- and that one line was the *only* thing stopping the OpenBSD build:
# its packaged Rust is 1.94.1, cargo refused before compiling anything, and the
# release shipped without an OpenBSD archive for two versions while the
# documentation explained the platform was behind. It was not. We were.
#
# Verified by installing 1.94.0 and checking every crate, including the GUI.
# `rust-toolchain.toml` still pins the newer toolchain for development and CI;
# this is the floor, and lowering it costs nothing until something in the tree
# needs a newer feature -- at which point cargo says so, by name.
rust-version = "1.94"
license = "GPL-3.0-or-later"
authors = ["tilas01"]
repository = "https://github.com/tilas01/veilvoice"
homepage = "https://github.com/tilas01/veilvoice"
# Deliberately no e-mail / personal identifiers anywhere in this tree.

[workspace.dependencies]
# --- DSP / math ---
realfft = "3"            # real-input FFT built on rustfft; re-exports num-complex
rustfft = "6"
# --- cryptographic randomness ---
getrandom = "0.2"        # OS CSPRNG seed
rand = "0.8"
rand_chacha = "0.3"      # ChaCha20 CSPRNG for parameter modulation
# --- secret hygiene ---
zeroize = { version = "1", features = ["derive"] }

# Reproducible-build friendly, maximally optimised release profile.
# codegen-units=1 + fat LTO also removes cross-CU nondeterminism.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

# Faster iteration while developing the DSP without losing all optimisation.
[profile.dev]
opt-level = 1
