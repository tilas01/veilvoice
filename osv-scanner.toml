#
# osv-scanner policy: the advisories this project has already weighed.
#
# osv-scanner reads `Cargo.lock` against the OSV database, which carries every
# RustSec advisory under the same identifier. The OpenSSF Scorecard does the
# same for its Vulnerabilities check. Neither reads `.cargo/audit.toml` or
# `deny.toml`, so without this file the exceptions argued there look like
# advisories nobody has looked at.
#
# The arguments live in `.cargo/audit.toml`. Each entry here gives the
# identifier and a one-line reason for whoever reads a scan, and
# `tools/audit/dependencies.py` fails the build if this list, `deny.toml` and
# `.cargo/audit.toml` stop naming the same advisories.
#
# This file applies to the directory it sits in. `fuzz/` has no lockfile of its
# own committed, so there is nothing below this one for a copy to cover.

